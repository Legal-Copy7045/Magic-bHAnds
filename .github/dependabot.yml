# Monthly, one grouped pull request per ecosystem (saves Actions minutes and review time).
# A bump of the hash-pinned signing tools (.github/requirements-signing*.txt) fails CI-047 until the
# pinned esptool version there is updated on purpose.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
