name: CI

# CI per the owner's project standard 1.1.0 (github.com/Legal-Copy7045/project-standards, STANDARD.md section 1),
# with this repository's own signed, attested release path (see .github/standard.yaml, beyond:):
# - Pull requests (never drafts: mark a PR ready once `python3 regression/run.py check` passes): the quick checks,
#   the privacy guard (loaded from main) and gitleaks on the PR's commits; the firmware build and the integration
#   tests only when the PR touches what they test (the changes job, .github/changes.yaml).
# - Push to main: the private-terms check (the privacy environment, main only), and, when VERSION has no v<VERSION>
#   tag yet, the release path: build, sign, attest, publish the web installer and create the GitHub Release, from
#   the same signed build. Nothing is re-tested and nothing else publishes, so devices only see released firmware.
# - Weekly (Sunday 01:47 UTC) and Run workflow: everything, full-history secret scan, audits; publishes nothing
#   (Run workflow on main with "release" ticked retries a release).
# Releases come only from main: the release path starts only for refs/heads/main, a pushed v* tag starts nothing,
# and a tag can't reach the signing key anyway: the release-signing environment's deployment branches allow main
# only (no tag rule), so GitHub refuses the key to any other ref, even if a tagged commit edits this file.
# ci-result is the only required check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "47 1 * * 0"        # Sunday 01:47 UTC: this project's slot (STANDARD.md 1.6)
  workflow_dispatch:
    inputs:
      release: {type: boolean, default: false, description: "Release VERSION if it has no tag yet (main only)"}

permissions:
  contents: read

# Actions are pinned to commit SHAs (the comment gives the tag), so a moved or hijacked tag can't change what runs
# here. A newer push to a pull request replaces its older run; runs on main are never cancelled (a merge landing
# during a release waits for it).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ESPHOME_VERSION: "2026.10.2"

jobs:
  changes:
    # Drafts run nothing (every other job needs this one).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.c.outputs.release }}
      full: ${{ steps.c.outputs.full }}
      firmware: ${{ steps.c.outputs.firmware }}
      integration: ${{ steps.c.outputs.integration }}
      lockfiles: ${{ steps.c.outputs.lockfiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RELEASE_INPUT: ${{ inputs.release }}
        run: python3 .github/scripts/changes.py

  quick:
    needs: changes
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.13"}
      - name: Install the pinned tools
        run: pip install -q "ruff==0.17.6" "pytest==9.2.0" "pyyaml==6.0.4" "pillow==13.0.0"
      - name: Check versions match
        run: python3 .github/scripts/check_versions.py
      - name: Lint (correctness rules) and the regression harness's own tests
        run: |
          ruff check --isolated --select F,E9,PLE,B --ignore B905,B008,B904 --target-version py313 --exclude '**/.esphome/**' custom_components .github/scripts regression tests
          python -m pytest -q regression/tests
      - name: Dependency audit (requirements changed, or weekly)
        if: needs.changes.outputs.lockfiles == 'true' || needs.changes.outputs.full == 'true'
        run: |
          pip install -q "pip-audit==2.10.1"
          pip-audit -r .github/requirements-signing-build.txt -r .github/requirements-signing.txt --require-hashes --disable-pip
          printf 'esphome==%s\n' "$ESPHOME_VERSION" > "$RUNNER_TEMP/esphome.txt"
          pip-audit -r "$RUNNER_TEMP/esphome.txt" --no-deps --disable-pip

  # The privacy guard (no-reply addresses, no credentials, nothing personal), loaded from main so a pull request
  # can't weaken it; the private terms only on main, in the "privacy" environment (PR code never sees them).
  privacy:
    needs: changes
    if: github.event_name != 'push'
    uses: Legal-Copy7045/project-standards/.github/workflows/privacy.yml@1f5964bc45844dc0cefda0374af8f8128daa1b40 # v1.1.0

  privacy-denylist:
    needs: changes
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    uses: Legal-Copy7045/project-standards/.github/workflows/privacy.yml@1f5964bc45844dc0cefda0374af8f8128daa1b40 # v1.1.0
    with: {denylist: true}
    secrets: inherit

  secrets:
    needs: changes
    if: github.event_name != 'push'
    uses: Legal-Copy7045/project-standards/.github/workflows/gitleaks.yml@1f5964bc45844dc0cefda0374af8f8128daa1b40 # v1.1.0
    with: {full-history: "${{ needs.changes.outputs.full == 'true' }}"}

  build:
    needs: changes
    if: needs.changes.outputs.firmware == 'true' || needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Read-only: the published firmware is attested in the sign job, after signing.
    permissions:
      contents: read
    # The three firmwares build side by side.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bridge
            dir: magicband-bridge
          - target: reader
            dir: magicband-reader
          - target: bp2
            dir: screek-bp2-poe
    env:
      TARGET: ${{ matrix.target }}
      DIR: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Cache ESPHome toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/esphome
          key: esphome-${{ env.ESPHOME_VERSION }}-${{ runner.os }}

      # The previous build's compiled files, so only what changed is compiled
      # again. Restored from main's builds only (GitHub never lets main read a
      # cache saved by a pull request), and saved only by main (below).
      - name: Restore the previous build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: esphome/.esphome/build/${{ matrix.dir }}
          key: fwbuild-${{ matrix.target }}-${{ env.ESPHOME_VERSION }}-${{ github.sha }}
          restore-keys: fwbuild-${{ matrix.target }}-${{ env.ESPHOME_VERSION }}-

      - name: Install ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}"

      # The official builds only install updates signed with the project's key,
      # and the Wi-Fi ones (bridge, reader) get the setup hotspot, whose upload
      # page that signature check covers (signed_build.py; the sign job signs
      # them). The device files themselves stay unlocked, without a hotspot,
      # for people who build their own. Each builds against this checkout's
      # component, add-on and sound files, not the copies on main.
      - name: Compile
        working-directory: esphome
        run: |
          case "$TARGET" in
            bridge)
              python3 ../.github/scripts/signed_build.py magicband-bridge.yaml ci.yaml ;;
            reader)
              sed -e 's#magicband: github://.*magicband-addon.yaml@main#magicband: !include magicband-addon.yaml#' \
                  -e 's#https://raw.githubusercontent.com/Legal-Copy7045/Magic-bHAnds/main/esphome/sounds/#sounds/#' \
                  magicband-reader.yaml > ci.yaml
              python3 ../.github/scripts/signed_build.py ci.yaml ci.yaml ;;
            bp2)
              sed 's#magicband: github://.*magicband-addon.yaml@main#magicband: !include magicband-addon.yaml#' \
                screek-bp2-poe.yaml > ci.yaml
              python3 ../.github/scripts/signed_build.py ci.yaml ci.yaml ;;
          esac
          esphome -s component_source ../components compile ci.yaml

      - name: Check the standalone BP2-POE file matches the shared add-on
        if: matrix.target == 'bp2'
        working-directory: esphome
        run: python3 ../.github/scripts/check_bp2_standalone.py

      - name: Save the build for the next one
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: esphome/.esphome/build/${{ matrix.dir }}
          key: fwbuild-${{ matrix.target }}-${{ env.ESPHOME_VERSION }}-${{ github.sha }}

      - name: Stage the unsigned build
        run: |
          mkdir -p "stage/$DIR/build"
          cp "esphome/.esphome/build/$DIR/build/firmware.ota.bin" \
             "esphome/.esphome/build/$DIR/build/firmware.factory.bin" "stage/$DIR/build/"
      - name: Upload the unsigned build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: builds-${{ matrix.target }}
          path: stage/
          retention-days: 3

  # The three builds together assemble into the site (unsigned; the sign job publishes).
  site-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: builds-*
          merge-multiple: true
          path: builds
      - name: Check the site assembles
        run: |
          python3 .github/scripts/make_site.py _site_check \
            bridge=builds/magicband-bridge/build=esphome/magicband-bridge.yaml \
            reader=builds/magicband-reader/build=esphome/magicband-reader.yaml \
            bp2=builds/screek-bp2-poe/build=esphome/screek-bp2-poe.yaml

  # The release path. Signs the firmware with the project's key, then assembles the site and the release files
  # from the signed images. Runs only for a push to main whose VERSION has no tag yet (or Run workflow on main with
  # "release" ticked), and the release-signing environment holding OTA_SIGNING_KEY allows only main (deployment
  # branches: main, no tag rule), so pull requests, other branches and pushed tags never reach the key: that
  # environment rule, not this file, is the real gate. The commit must also be on main before anything else runs.
  # The account that can push to main is what protects releases: it should use two-factor authentication, and the
  # environment stays limited to main (see docs/security.md).
  sign:
    if: needs.changes.outputs.release == 'true' && github.ref == 'refs/heads/main'
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Same check as the release job, before the key is touched: only a
      # commit on main is ever signed.
      - name: Check the commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA isn't on main"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # This job holds the signing key, so everything it installs is pinned by
      # hash, transitive dependencies included (esptool is only published as
      # source: it is built with the pinned setuptools, no build isolation).
      - name: Install esptool (hash-pinned)
        run: |
          pip install --require-hashes --no-deps --only-binary :all: -r .github/requirements-signing-build.txt
          pip install --require-hashes --no-deps --no-build-isolation -r .github/requirements-signing.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: builds-*
          merge-multiple: true
          path: builds
      - name: Sign the firmware
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          [ -n "$OTA_SIGNING_KEY" ] || { echo "::error::OTA_SIGNING_KEY isn't set in the release-signing environment"; exit 1; }
          key="$RUNNER_TEMP/signing-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$OTA_SIGNING_KEY" > "$key")
          python3 .github/scripts/sign_firmware.py "$key" esphome/firmware-signing-key.pub.pem \
            builds/magicband-bridge/build builds/magicband-reader/build builds/screek-bp2-poe/build
      - name: Assemble site
        run: |
          python3 .github/scripts/make_site.py _site \
            bridge=builds/magicband-bridge/build=esphome/magicband-bridge.yaml \
            reader=builds/magicband-reader/build=esphome/magicband-reader.yaml \
            bp2=builds/screek-bp2-poe/build=esphome/screek-bp2-poe.yaml
      - name: Attest the published firmware
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: _site/**/*.bin
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          retention-days: 3
          path: |
            _site/firmware/*.bin
            _site/reader/firmware/*.bin
            _site/bp2/firmware/*.bin
  # Tests for the Home Assistant integration (custom_components/magicband).
  test-integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install test framework
        run: pip install "pytest-homeassistant-custom-component==0.13.316" "fonttools==4.60.2"

      - name: Run tests
        run: python -m pytest -q

  deploy:
    if: needs.changes.outputs.release == 'true' && github.ref == 'refs/heads/main'
    needs: [changes, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Creates the tag v<VERSION> and the GitHub Release from the build sign has just signed and published (the
  # release path only; after the private-terms check).
  release:
    if: needs.changes.outputs.release == 'true' && github.ref == 'refs/heads/main'
    needs: [changes, sign, privacy-denylist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Signed build-provenance attestations for the released files, so anyone
      # can check a download came from this workflow on main (docs/security.md):
      #   gh attestation verify <file> --repo Legal-Copy7045/Magic-bHAnds \
      #     --signer-workflow Legal-Copy7045/Magic-bHAnds/.github/workflows/ci.yml \
      #     --source-ref refs/heads/main
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Only commits on main are released, whatever started the run.
      - name: Check the commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA isn't on main"; exit 1; }

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: firmware
          path: firmware

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          TAG="v$V"
          python3 .github/scripts/check_versions.py "$TAG"
          python3 .github/scripts/release_notes.py "$TAG" > notes.md
          (cd custom_components && zip -qr "../magicband-integration-$V.zip" magicband)
          find firmware -name '*.bin' | while read -r f; do
            cp "$f" "./$(basename "${f%.bin}")-$V.bin"
          done
          gh release create "$TAG" --target "$GITHUB_SHA" --title "MagicbHAnds $V" --notes-file notes.md \
            magicband-integration-$V.zip ./*-$V.bin

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            magicband-integration-*.zip
            *.bin
            firmware/**/*.bin

  # The one required check: fails when a needed job failed or was cancelled, passes when they passed or were skipped.
  ci-result:
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [changes, quick, privacy, privacy-denylist, secrets, build, site-check, test-integration, sign, deploy, release]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then echo "A needed job failed or was cancelled."; exit 1; fi
