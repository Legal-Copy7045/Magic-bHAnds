name: Build, test & release

# GitHub Actions minutes are limited, so this runs only when it's needed:
# - Pull requests (never drafts: mark a PR ready once local checks pass) build
#   the firmware and run the integration tests, each only when the PR touches
#   what it tests.
# - A merge to main runs only when it raises VERSION: it builds, signs and
#   publishes the web installer, and releases (tags v<VERSION> and creates the
#   GitHub Release with the firmware and integration attached, from the same
#   signed build). Other merges to main run nothing.
# - Once a week, main gets a full build and test run (no signing or release).
# - Run workflow on main does a full run, signs and publishes the web
#   installer; with "release" ticked it also releases (to retry a release).
# Releases come only from main: the sign job runs only for refs/heads/main, so
# release (which needs sign) can't run anywhere else, and a pushed v* tag
# starts nothing at all. A tag can't reach the signing key anyway: the
# release-signing environment's deployment branches allow main only (no tag
# rule), so GitHub refuses the key to any other ref, even if a tagged commit
# edits this file.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    # Only a merge that raises VERSION (a release) runs on main.
    branches: [main]
    paths: [VERSION]
  schedule:
    - cron: "17 7 * * 1"   # weekly full run on main (Mondays, 07:17 UTC)
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release for the version in VERSION"
        type: boolean
        default: false

permissions:
  contents: read

# Actions are pinned to commit SHAs (the comment gives the tag), so a moved or
# hijacked tag can't change what runs here. Update them deliberately.

# A newer push to a pull request replaces its older build. Runs on main are
# never cancelled: every push to main signs and publishes, and one that raises
# VERSION releases, so a merge landing mid-release waits for it instead of
# cutting it off half-done. Release runs from the Actions page aren't either.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ESPHOME_VERSION: "2026.10.2"

jobs:
  versions:
    # Draft pull requests run nothing (every other job needs this one).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      # "true" when a pull request changes something the firmware is built from
      # (always "true" outside pull requests): otherwise the build is skipped.
      firmware: ${{ steps.changes.outputs.firmware }}
      # "true" when a pull request changes the integration, its tests or the regression harness
      # (always "true" outside pull requests): otherwise the integration tests are skipped.
      integration: ${{ steps.changes.outputs.integration }}
      # "true" on a push to main whose VERSION has no release tag yet: release.
      new_version: ${{ steps.release.outputs.new_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check versions match
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: python3 .github/scripts/check_versions.py $TAG
      - name: What does this pull request change?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fw=true
          it=true
          if [ "$EVENT" = pull_request ]; then
            changed="$(git diff --name-only "$BASE...$HEAD")"
            echo "$changed"
            echo "$changed" | grep -qE '^(esphome/|components/|VERSION$|\.github/(workflows/firmware\.yml$|requirements|scripts/(signed_build|make_site|check_bp2_standalone|sign_firmware)\.py$))' || fw=false
            echo "$changed" | grep -qE '^(custom_components/|tests/|regression/|pytest\.ini$|VERSION$|\.github/workflows/firmware\.yml$)' || it=false
          fi
          echo "firmware=$fw" >> "$GITHUB_OUTPUT"
          echo "integration=$it" >> "$GITHUB_OUTPUT"
          echo "Build the firmware: $fw; run the integration tests: $it"
      - name: Is VERSION a new release?
        id: release
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          new=false
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            v="$(tr -d '[:space:]' < VERSION)"
            git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null || new=true
          fi
          echo "new_version=$new" >> "$GITHUB_OUTPUT"
          echo "New release: $new"

  build:
    needs: versions
    if: needs.versions.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    # Read-only: the published firmware is attested in the sign job, after signing.
    permissions:
      contents: read
    # The three firmwares build side by side.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bridge
            dir: magicband-bridge
          - target: reader
            dir: magicband-reader
          - target: bp2
            dir: screek-bp2-poe
    env:
      TARGET: ${{ matrix.target }}
      DIR: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Cache ESPHome toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/esphome
          key: esphome-${{ env.ESPHOME_VERSION }}-${{ runner.os }}

      # The previous build's compiled files, so only what changed is compiled
      # again. Restored from main's builds only (GitHub never lets main read a
      # cache saved by a pull request), and saved only by main (below).
      - name: Restore the previous build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: esphome/.esphome/build/${{ matrix.dir }}
          key: fwbuild-${{ matrix.target }}-${{ env.ESPHOME_VERSION }}-${{ github.sha }}
          restore-keys: fwbuild-${{ matrix.target }}-${{ env.ESPHOME_VERSION }}-

      - name: Install ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}"

      # The official builds only install updates signed with the project's key,
      # and the Wi-Fi ones (bridge, reader) get the setup hotspot, whose upload
      # page that signature check covers (signed_build.py; the sign job signs
      # them). The device files themselves stay unlocked, without a hotspot,
      # for people who build their own. Each builds against this checkout's
      # component, add-on and sound files, not the copies on main.
      - name: Compile
        working-directory: esphome
        run: |
          case "$TARGET" in
            bridge)
              python3 ../.github/scripts/signed_build.py magicband-bridge.yaml ci.yaml ;;
            reader)
              sed -e 's#magicband: github://.*magicband-addon.yaml@main#magicband: !include magicband-addon.yaml#' \
                  -e 's#https://raw.githubusercontent.com/Legal-Copy7045/Magic-bHAnds/main/esphome/sounds/#sounds/#' \
                  magicband-reader.yaml > ci.yaml
              python3 ../.github/scripts/signed_build.py ci.yaml ci.yaml ;;
            bp2)
              sed 's#magicband: github://.*magicband-addon.yaml@main#magicband: !include magicband-addon.yaml#' \
                screek-bp2-poe.yaml > ci.yaml
              python3 ../.github/scripts/signed_build.py ci.yaml ci.yaml ;;
          esac
          esphome -s component_source ../components compile ci.yaml

      - name: Check the standalone BP2-POE file matches the shared add-on
        if: matrix.target == 'bp2'
        working-directory: esphome
        run: python3 ../.github/scripts/check_bp2_standalone.py

      - name: Save the build for the next one
        if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: esphome/.esphome/build/${{ matrix.dir }}
          key: fwbuild-${{ matrix.target }}-${{ env.ESPHOME_VERSION }}-${{ github.sha }}

      - name: Stage the unsigned build
        run: |
          mkdir -p "stage/$DIR/build"
          cp "esphome/.esphome/build/$DIR/build/firmware.ota.bin" \
             "esphome/.esphome/build/$DIR/build/firmware.factory.bin" "stage/$DIR/build/"
      - name: Upload the unsigned build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: builds-${{ matrix.target }}
          path: stage/

  # The three builds together assemble into the site (unsigned; the sign job publishes).
  site-check:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: builds-*
          merge-multiple: true
          path: builds
      - name: Check the site assembles
        run: |
          python3 .github/scripts/make_site.py _site_check \
            bridge=builds/magicband-bridge/build=esphome/magicband-bridge.yaml \
            reader=builds/magicband-reader/build=esphome/magicband-reader.yaml \
            bp2=builds/screek-bp2-poe/build=esphome/screek-bp2-poe.yaml

  # Signs the firmware with the project's key, then assembles the site and the
  # release files from the signed images. Only main gets here (a push to main
  # or Run workflow on main), and the release-signing environment holding
  # OTA_SIGNING_KEY allows only main (deployment branches: main, no tag rule),
  # so pull requests, other branches and pushed tags never reach the key: that
  # environment rule, not this file, is the real gate. The commit must also be
  # on main before anything else runs. Every push to main is signed, so the
  # account that can push to main is what protects releases: it should use
  # two-factor authentication, and the environment stays limited to main
  # (see docs/security.md).
  sign:
    # A release (a push to main, which only VERSION changes start) or Run workflow; never the weekly run.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Same check as the release job, before the key is touched: only a
      # commit on main is ever signed.
      - name: Check the commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA isn't on main"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # This job holds the signing key, so everything it installs is pinned by
      # hash, transitive dependencies included (esptool is only published as
      # source: it is built with the pinned setuptools, no build isolation).
      - name: Install esptool (hash-pinned)
        run: |
          pip install --require-hashes --no-deps --only-binary :all: -r .github/requirements-signing-build.txt
          pip install --require-hashes --no-deps --no-build-isolation -r .github/requirements-signing.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: builds-*
          merge-multiple: true
          path: builds
      - name: Sign the firmware
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          [ -n "$OTA_SIGNING_KEY" ] || { echo "::error::OTA_SIGNING_KEY isn't set in the release-signing environment"; exit 1; }
          key="$RUNNER_TEMP/signing-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$OTA_SIGNING_KEY" > "$key")
          python3 .github/scripts/sign_firmware.py "$key" esphome/firmware-signing-key.pub.pem \
            builds/magicband-bridge/build builds/magicband-reader/build builds/screek-bp2-poe/build
      - name: Assemble site
        run: |
          python3 .github/scripts/make_site.py _site \
            bridge=builds/magicband-bridge/build=esphome/magicband-bridge.yaml \
            reader=builds/magicband-reader/build=esphome/magicband-reader.yaml \
            bp2=builds/screek-bp2-poe/build=esphome/screek-bp2-poe.yaml
      - name: Attest the published firmware
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: _site/**/*.bin
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: |
            _site/firmware/*.bin
            _site/reader/firmware/*.bin
            _site/bp2/firmware/*.bin
  # Tests for the Home Assistant integration (custom_components/magicband).
  test-integration:
    needs: versions
    if: needs.versions.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install test framework
        run: pip install "pytest-homeassistant-custom-component==0.13.316" "fonttools==4.60.1"

      - name: Run tests
        run: python -m pytest -q

      - name: Run the regression harness's own tests
        run: python -m pytest -q regression/tests

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [sign, test-integration]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Runs on main only: for a push whose VERSION has no release yet (a merged
  # version bump), or from Run workflow with release ticked. It releases the
  # build that sign has just signed and published. A pushed v* tag never gets
  # here: sign only runs on main.
  release:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && needs.versions.outputs.new_version == 'true') || (github.event_name == 'workflow_dispatch' && inputs.release))
    needs: [versions, sign, test-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signed build-provenance attestations for the released files, so anyone
      # can check a download came from this workflow on main (docs/security.md):
      #   gh attestation verify <file> --repo Legal-Copy7045/Magic-bHAnds \
      #     --signer-workflow Legal-Copy7045/Magic-bHAnds/.github/workflows/firmware.yml \
      #     --source-ref refs/heads/main
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Only commits on main are released, whatever started the run.
      - name: Check the commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA isn't on main"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware
          path: firmware

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          TAG="v$V"
          python3 .github/scripts/check_versions.py "$TAG"
          python3 .github/scripts/release_notes.py "$TAG" > notes.md
          (cd custom_components && zip -qr "../magicband-integration-$V.zip" magicband)
          find firmware -name '*.bin' | while read -r f; do
            cp "$f" "./$(basename "${f%.bin}")-$V.bin"
          done
          gh release create "$TAG" --target "$GITHUB_SHA" --title "MagicbHAnds $V" --notes-file notes.md \
            magicband-integration-$V.zip ./*-$V.bin

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            magicband-integration-*.zip
            *.bin
            firmware/**/*.bin
