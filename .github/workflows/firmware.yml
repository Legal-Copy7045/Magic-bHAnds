name: Build firmware & web installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  ESPHOME_VERSION: "2026.10.2"
  DEVICE_YAML: esphome/magicband-bridge.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache ESPHome toolchain
        uses: actions/cache@v6
        with:
          path: ~/.cache/esphome
          key: esphome-${{ env.ESPHOME_VERSION }}-${{ runner.os }}

      - name: Install ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}"

      - name: Compile
        working-directory: esphome
        # Build against the component in this checkout, not the copy on main.
        run: esphome -s component_source ../components compile magicband-bridge.yaml

      - name: Assemble site
        run: |
          python3 .github/scripts/make_site.py \
            esphome/.esphome/build/magicband-bridge/build \
            "$DEVICE_YAML" _site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Upload firmware (for testing PR builds)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: _site/firmware

  # Compile-check the SCREEK BP2-POE and MagicBand Reader configs (not
  # published; built by the user in the ESPHome Device Builder).
  build-bp2-poe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache ESPHome toolchain
        uses: actions/cache@v6
        with:
          path: ~/.cache/esphome
          key: esphome-${{ env.ESPHOME_VERSION }}-${{ runner.os }}-bp2

      - name: Install ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}"

      - name: Compile
        working-directory: esphome
        run: |
          # Use this checkout's add-on rather than the copy on main, and a dummy key.
          sed 's#magicband: github://.*magicband-addon.yaml@main#magicband: !include magicband-addon.yaml#' \
            screek-bp2-poe.yaml > bp2-ci.yaml
          echo "bp2_api_key: \"$(python3 -c 'import secrets,base64;print(base64.b64encode(secrets.token_bytes(32)).decode())')\"" > secrets.yaml
          esphome -s component_source ../components compile bp2-ci.yaml

      - name: Compile MagicBand Reader
        working-directory: esphome
        run: |
          sed 's#magicband: github://.*magicband-addon.yaml@main#magicband: !include magicband-addon.yaml#' \
            magicband-reader.yaml > reader-ci.yaml
          KEY="$(python3 -c 'import secrets,base64;print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          printf 'bp2_api_key: "%s"\nreader_api_key: "%s"\nwifi_ssid: "ci"\nwifi_password: "ci-password"\n' "$KEY" "$KEY" > secrets.yaml
          # Build with this checkout's sound files rather than the copies on main.
          sed -i 's#https://raw.githubusercontent.com/Legal-Copy7045/Magic-bHAnds/main/esphome/sounds/#sounds/#' reader-ci.yaml
          esphome -s component_source ../components compile reader-ci.yaml

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
