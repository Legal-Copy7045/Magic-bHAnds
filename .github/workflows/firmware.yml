name: Build firmware & web installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  ESPHOME_VERSION: "2026.10.2"
  DEVICE_YAML: esphome/magicband-bridge.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache ESPHome toolchain
        uses: actions/cache@v6
        with:
          path: ~/.cache/esphome
          key: esphome-${{ env.ESPHOME_VERSION }}-${{ runner.os }}

      - name: Install ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}"

      - name: Compile
        working-directory: esphome
        # Build against the component in this checkout, not the copy on main.
        run: esphome -s component_source ../components compile magicband-bridge.yaml

      - name: Assemble site
        run: |
          python3 .github/scripts/make_site.py \
            esphome/.esphome/build/magicband-bridge/build \
            "$DEVICE_YAML" _site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Upload firmware (for testing PR builds)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: _site/firmware

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
