name: Build, test & release

# Every push (any branch) builds the firmware, runs the integration tests and
# (from main) publishes the web installer. To release: Actions -> "Build, test & release"
# -> Run workflow on main with "release" ticked. That tags v<VERSION> and
# creates a GitHub Release with the firmware and integration attached.
# (Pushing a v* tag yourself does the same.)
on:
  push:
    # Every branch builds and tests; only main publishes the site and only
    # main or a v* tag can release (see the deploy and release jobs).
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release for the version in VERSION"
        type: boolean
        default: false

permissions:
  contents: read

# Actions are pinned to commit SHAs (the comment gives the tag), so a moved or
# hijacked tag can't change what runs here. Update them deliberately.

# A newer push replaces an older build of the same branch, but a release run
# (started from the Actions page) is never cancelled.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  ESPHOME_VERSION: "2026.10.2"

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check versions match
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: python3 .github/scripts/check_versions.py $TAG

  build:
    needs: versions
    runs-on: ubuntu-latest
    # Read-only: the published firmware is attested in the sign job, after signing.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Cache ESPHome toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/esphome
          key: esphome-${{ env.ESPHOME_VERSION }}-${{ runner.os }}

      - name: Install ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}"

      # The official builds only install updates signed with the project's key
      # (signed_build.py; the sign job signs them). The device files themselves
      # stay unlocked for people who build their own.
      - name: Compile MagicBand Bridge
        working-directory: esphome
        # Build against this checkout's component, not the copy on main.
        run: |
          python3 ../.github/scripts/signed_build.py magicband-bridge.yaml bridge-ci.yaml
          esphome -s component_source ../components compile bridge-ci.yaml

      - name: Compile MagicBand Reader
        working-directory: esphome
        run: |
          # This checkout's add-on and sound files rather than the copies on main.
          sed -e 's#magicband: github://.*magicband-addon.yaml@main#magicband: !include magicband-addon.yaml#' \
              -e 's#https://raw.githubusercontent.com/Legal-Copy7045/Magic-bHAnds/main/esphome/sounds/#sounds/#' \
              magicband-reader.yaml > reader-ci.yaml
          python3 ../.github/scripts/signed_build.py reader-ci.yaml reader-ci.yaml
          esphome -s component_source ../components compile reader-ci.yaml

      - name: Compile SCREEK BP2-POE
        working-directory: esphome
        run: |
          sed 's#magicband: github://.*magicband-addon.yaml@main#magicband: !include magicband-addon.yaml#' \
            screek-bp2-poe.yaml > bp2-ci.yaml
          python3 ../.github/scripts/signed_build.py bp2-ci.yaml bp2-ci.yaml
          esphome -s component_source ../components compile bp2-ci.yaml

      - name: Check the standalone BP2-POE file matches the shared add-on
        working-directory: esphome
        run: python3 ../.github/scripts/check_bp2_standalone.py

      - name: Check the site assembles (unsigned; the sign job publishes)
        run: |
          python3 .github/scripts/make_site.py _site_check \
            bridge=esphome/.esphome/build/magicband-bridge/build=esphome/magicband-bridge.yaml \
            reader=esphome/.esphome/build/magicband-reader/build=esphome/magicband-reader.yaml \
            bp2=esphome/.esphome/build/screek-bp2-poe/build=esphome/screek-bp2-poe.yaml
      - name: Upload the unsigned builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: builds
          # The builds live under esphome/.esphome, which upload-artifact skips by default.
          include-hidden-files: true
          path: |
            esphome/.esphome/build/*/build/firmware.ota.bin
            esphome/.esphome/build/*/build/firmware.factory.bin
  # Signs the firmware with the project's key, then assembles the site and the
  # release files from the signed images. Only main and release tags get here,
  # and the release-signing environment holding OTA_SIGNING_KEY allows
  # only those, so pull requests and other branches never reach the key. A
  # tag's commit must be on main before anything else runs. Give the
  # release-signing environment a required reviewer (Settings -> Environments)
  # so every signed build waits for approval (see docs/security.md).
  sign:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Same check as the release job, before the key is touched: a v* tag
      # pushed on another branch is never signed.
      - name: Check the commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA isn't on main"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # This job holds the signing key, so everything it installs is pinned by
      # hash, transitive dependencies included (esptool is only published as
      # source: it is built with the pinned setuptools, no build isolation).
      - name: Install esptool (hash-pinned)
        run: |
          pip install --require-hashes --no-deps --only-binary :all: -r .github/requirements-signing-build.txt
          pip install --require-hashes --no-deps --no-build-isolation -r .github/requirements-signing.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: builds
          path: builds
      - name: Sign the firmware
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          [ -n "$OTA_SIGNING_KEY" ] || { echo "::error::OTA_SIGNING_KEY isn't set in the release-signing environment"; exit 1; }
          key="$RUNNER_TEMP/signing-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$OTA_SIGNING_KEY" > "$key")
          python3 .github/scripts/sign_firmware.py "$key" esphome/firmware-signing-key.pub.pem \
            builds/magicband-bridge/build builds/magicband-reader/build builds/screek-bp2-poe/build
      - name: Assemble site
        run: |
          python3 .github/scripts/make_site.py _site \
            bridge=builds/magicband-bridge/build=esphome/magicband-bridge.yaml \
            reader=builds/magicband-reader/build=esphome/magicband-reader.yaml \
            bp2=builds/screek-bp2-poe/build=esphome/screek-bp2-poe.yaml
      - name: Attest the published firmware
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: _site/**/*.bin
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: |
            _site/firmware/*.bin
            _site/reader/firmware/*.bin
            _site/bp2/firmware/*.bin
  # Tests for the Home Assistant integration (custom_components/magicband).
  test-integration:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install test framework
        run: pip install "pytest-homeassistant-custom-component==0.13.316" "fonttools==4.60.1"

      - name: Run tests
        run: python -m pytest -q

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [sign, test-integration]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [sign, test-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signed build-provenance attestations for the released files, so anyone
      # can check a download came from this workflow on main (docs/security.md):
      #   gh attestation verify <file> --repo Legal-Copy7045/Magic-bHAnds \
      #     --signer-workflow Legal-Copy7045/Magic-bHAnds/.github/workflows/firmware.yml \
      #     --source-ref refs/heads/main
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Only commits on main are released, whatever started the run (a pushed
      # v* tag on another branch would otherwise become an attested release).
      - name: Check the commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA isn't on main"; exit 1; }

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: firmware
          path: firmware

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          TAG="v$V"
          python3 .github/scripts/check_versions.py "$TAG"
          python3 .github/scripts/release_notes.py "$TAG" > notes.md
          (cd custom_components && zip -qr "../magicband-integration-$V.zip" magicband)
          find firmware -name '*.bin' | while read -r f; do
            cp "$f" "./$(basename "${f%.bin}")-$V.bin"
          done
          gh release create "$TAG" --target "$GITHUB_SHA" --title "MagicbHAnds $V" --notes-file notes.md \
            magicband-integration-$V.zip ./*-$V.bin

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            magicband-integration-*.zip
            *.bin
            firmware/**/*.bin
