# Keeps personal details out of this public repository (see .github/scripts/privacy_guard.py).
# Runs on pull requests (not drafts: the guard is also run locally before every push), and by hand
# with Run workflow, which checks the whole history.
name: Privacy guard
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the guard checks every commit in BASE..HEAD (the
          # pull request's base and head), or the whole history without a BASE.
          fetch-depth: 0
          persist-credentials: false
      - name: Check for personal details
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/privacy_guard.py
