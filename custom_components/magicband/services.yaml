sync:

set_reader_camera:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: esphome
              model: magicband-reader
    camera:
      selector:
        entity:
          domain: camera

pair_reader:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: esphome
              model: magicband-reader

unpair_reader:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: esphome
              model: magicband-reader

answer:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: esphome
              model: magicband-reader
    allow:
      required: true
      default: true
      selector:
        boolean:

play_show:
  fields:
    show:
      default: Random
      selector:
        select:
          options: [Random, Rainbow rush, Fireworks, Comet chase, Colour parade, Twinkle, Heartbeat, Ocean, Fire, Pinwheel, Confetti, Penguins, Goal, Aurora, Candy cane, Thunderstorm, Sunrise, Disco]
    device_id:
      selector:
        device:
          multiple: true
          filter:
            - integration: esphome
              model: magicband-reader

list:

send:
  fields:
    effect:
      default: color
      selector:
        select:
          options: [color, rgb, dual_color, five_color, crossfade, circle, animation, buzz, ping, wake, "off", raw, stop]
    color:
      example: red
      selector:
        text:
    color2:
      example: pink
      selector:
        text:
    colors:
      example: "red, orange, yellow, green, blue"
      selector:
        text:
    rgb_color:
      example: [255, 0, 180]
      selector:
        color_rgb:
    animation:
      selector:
        select:
          options:
            - lightning
            - orange_blink
            - color_cycle
            - rainbow
            - circle
            - alternating
            - crossfade
            - crossfade_2
            - crossfade_3
            - crossfade_4
            - crossfade_5
            - crossfade_6
            - crossfade_7
            - spin_buzz
            - spin_buzz_2
            - spin_buzz_3
            - show_0e_1
            - show_0e_2
            - show_0e_3
            - show_0e_4
            - show_0e_5
            - show_0f_1
            - show_0f_2
            - show_e913
            - show_13_2
            - show_13_3
            - show_14_1
            - show_14_2
            - show_14_3
            - show_07_1
            - show_07_2
    vibration:
      default: 0
      selector:
        number: {min: 0, max: 15, step: 1, mode: slider}
    leds:
      selector:
        select:
          options: [all, top_left, top_right, bottom_left, bottom_right]
    on_seconds:
      selector:
        number: {min: 0, max: 52, step: 1, mode: slider}
    fade_seconds:
      selector:
        number: {min: 0, max: 3, step: 1, mode: slider}
    always_on:
      selector:
        boolean:
    flash:
      selector:
        boolean:
    fast:
      selector:
        boolean:
    seconds:
      example: 15
      selector:
        number: {min: 1, max: 60, step: 1, mode: slider, unit_of_measurement: s}
    hex:
      selector:
        text:
    duration_ms:
      selector:
        number: {min: 0, max: 30000, step: 100, mode: box}
    command:
      selector:
        object:
    bridges:
      selector:
        entity:
          multiple: true
          filter:
            - integration: esphome
              domain: text

