<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="band" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C2F9E"/>
      <stop offset="1" stop-color="#1D4E9E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="rotate(-16 226 318)">
    <!-- whole band in the darker inside colour -->
    <ellipse cx="226" cy="318" rx="160" ry="102" fill="none" stroke="url(#back)" stroke-width="56"/>
    <!-- front half in the bright outside colour (butt caps meet the back cleanly) -->
    <path d="M66 318 A160 102 0 0 0 386 318" fill="none" stroke="url(#band)" stroke-width="62"/>
    <path d="M100 344 A140 84 0 0 0 352 344" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="9" stroke-linecap="round"/>
    <!-- face with green LED -->
    <circle cx="226" cy="420" r="70" fill="url(#glow)"/>
    <rect x="186" y="394" width="80" height="52" rx="21" fill="#ffffff"/>
    <circle cx="226" cy="420" r="12" fill="#22C55E"/>
  </g>
  <!-- NFC signal arcs, top right, clear of the band -->
  <g fill="none" stroke-linecap="round" stroke-width="24">
    <path d="M378 128 A56 56 0 0 1 434 184" stroke="#3B82F6"/>
    <path d="M380 62 A120 120 0 0 1 498 180" stroke="#8B5CF6"/>
  </g>
  <!-- sparkle -->
  <path d="M110 60 L123 101 L164 114 L123 127 L110 168 L97 127 L56 114 L97 101 Z" fill="#FBBF24"/>
  <circle cx="186" cy="74" r="10" fill="#FBBF24"/>
</svg>
