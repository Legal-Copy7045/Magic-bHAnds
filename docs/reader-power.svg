<rect x="300" y="618" width="380" height="76" rx="10" class="warn"/>
<text x="316.0" y="642.0" class="h3" text-anchor="start" >Before connecting anything:</text>
<text x="316.0" y="662.0" class="t" text-anchor="start" >measure 4.75–5.25 V across + and −,</text>
<text x="316.0" y="678.0" class="t" text-anchor="start" >unplug and re-plug, and measure again.</text>
<rect x="720" y="230" width="140" height="52" rx="7" class="hub hubp"/>
