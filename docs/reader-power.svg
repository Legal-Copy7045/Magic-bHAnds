<text x="490.0" y="712.0" class="small" text-anchor="middle" >Use one board or the other (B's wires dashed). 22 AWG stranded, ≤ 30 cm to the hubs.</text>
<rect x="940" y="96" width="356" height="118" rx="10" class="load"/>
<text x="954.0" y="120.0" class="h3w" text-anchor="start" >ESP32-S3 board: 5V and GND pins</text>
<text x="954.0" y="140.0" class="tw" text-anchor="start" >Own wires from the hubs (terminal base: soldered</text>
<text x="954.0" y="156.0" class="tw" text-anchor="start" >to its 5V/GND pads). Breadboard: fed from the</text>
<text x="954.0" y="172.0" class="tw" text-anchor="start" >rail via a21/a22. Unplug its 5 V before using USB.</text>
<rect x="1204" y="106" width="80" height="22" rx="11" class="amp"/>
<text x="1244.0" y="121.0" class="ampt" text-anchor="middle" >≤ 0.5 A</text>
<rect x="934" y="179" width="10" height="10" rx="2" class="pinr"/>
<rect x="934" y="195" width="10" height="10" rx="2" class="pinb"/>
<text x="952.0" y="188.0" class="pinl" text-anchor="start" >5V</text>
<text x="952.0" y="204.0" class="pinl" text-anchor="start" >GND</text>
<polyline points="768.0,236.0 768.0,214.0 880.0,214.0 880.0,184.0 939.0,184.0" class="w p5"/>
<circle cx="768.0" cy="236.0" r="3.6" class="end p5"/>
<circle cx="939.0" cy="184.0" r="3.6" class="end p5"/>
<polyline points="768.0,476.0 768.0,454.0 882.0,454.0 882.0,200.0 939.0,200.0" class="w gnd"/>
<circle cx="768.0" cy="476.0" r="3.6" class="end gnd"/>
<circle cx="939.0" cy="200.0" r="3.6" class="end gnd"/>
<text x="1286.0" y="208.0" class="small" text-anchor="end" >22 AWG, ≤ 20 cm</text>
<circle cx="916" cy="168" r="10" class="mark"/>
<text x="916.0" y="172.0" class="markno" text-anchor="middle" >!</text>
<rect x="940" y="246" width="356" height="118" rx="10" class="load"/>
<text x="954.0" y="270.0" class="h3w" text-anchor="start" >Breadboard rails or interface board</text>
<text x="954.0" y="290.0" class="tw" text-anchor="start" >PN532 (5 V), 74AHCT125, I²C pull-ups.</text>
<text x="954.0" y="306.0" class="tw" text-anchor="start" >Breadboard: L+24 / L−25. Interface board: L+25 / L−26.</text>
<rect x="1204" y="256" width="80" height="22" rx="11" class="amp"/>
<text x="1244.0" y="271.0" class="ampt" text-anchor="middle" >≤ 0.2 A</text>
<rect x="934" y="329" width="10" height="10" rx="2" class="pinr"/>
<rect x="934" y="345" width="10" height="10" rx="2" class="pinb"/>
<text x="952.0" y="338.0" class="pinl" text-anchor="start" >5V</text>
<text x="952.0" y="354.0" class="pinl" text-anchor="start" >GND</text>
<polyline points="790.0,236.0 790.0,206.0 890.0,206.0 890.0,334.0 939.0,334.0" class="w p5"/>
<circle cx="790.0" cy="236.0" r="3.6" class="end p5"/>
<circle cx="939.0" cy="334.0" r="3.6" class="end p5"/>
<polyline points="790.0,476.0 790.0,446.0 892.0,446.0 892.0,350.0 939.0,350.0" class="w gnd"/>
<circle cx="790.0" cy="476.0" r="3.6" class="end gnd"/>
<circle cx="939.0" cy="350.0" r="3.6" class="end gnd"/>
<text x="1286.0" y="358.0" class="small" text-anchor="end" >22 AWG, ≤ 20 cm</text>
<rect x="940" y="396" width="356" height="118" rx="10" class="load"/>
<text x="954.0" y="420.0" class="h3w" text-anchor="start" >Amplifier (MAX98357A) VIN / GND</text>
<text x="954.0" y="440.0" class="tw" text-anchor="start" >100 µF across VIN and GND within 5 cm of the</text>
<text x="954.0" y="456.0" class="tw" text-anchor="start" >amplifier, stripe to GND (breadboard: g51–g52).</text>
<rect x="1204" y="406" width="80" height="22" rx="11" class="amp"/>
<text x="1244.0" y="421.0" class="ampt" text-anchor="middle" >≤ 0.65 A</text>
<rect x="934" y="479" width="10" height="10" rx="2" class="pinr"/>
<rect x="934" y="495" width="10" height="10" rx="2" class="pinb"/>
<text x="952.0" y="488.0" class="pinl" text-anchor="start" >5V</text>
<text x="952.0" y="504.0" class="pinl" text-anchor="start" >GND</text>
<polyline points="812.0,236.0 812.0,198.0 900.0,198.0 900.0,484.0 939.0,484.0" class="w p5"/>
<circle cx="812.0" cy="236.0" r="3.6" class="end p5"/>
<circle cx="939.0" cy="484.0" r="3.6" class="end p5"/>
<polyline points="812.0,476.0 812.0,438.0 902.0,438.0 902.0,500.0 939.0,500.0" class="w gnd"/>
<circle cx="812.0" cy="476.0" r="3.6" class="end gnd"/>
<circle cx="939.0" cy="500.0" r="3.6" class="end gnd"/>
<text x="1286.0" y="508.0" class="small" text-anchor="end" >22 AWG, ≤ 30 cm</text>
<rect x="940" y="546" width="356" height="118" rx="10" class="load"/>
<text x="954.0" y="570.0" class="h3w" text-anchor="start" >LED ring or strip: 5V / GND pads</text>
<text x="954.0" y="590.0" class="tw" text-anchor="start" >1000 µF 10 V soldered across its input pads,</text>
<text x="954.0" y="606.0" class="tw" text-anchor="start" >stripe to GND. Over 24 LEDs: firmware caps it.</text>
<rect x="1204" y="556" width="80" height="22" rx="11" class="amp"/>
<text x="1244.0" y="571.0" class="ampt" text-anchor="middle" >≤ 1.44 A</text>
<rect x="934" y="629" width="10" height="10" rx="2" class="pinr"/>
<rect x="934" y="645" width="10" height="10" rx="2" class="pinb"/>
<text x="952.0" y="638.0" class="pinl" text-anchor="start" >5V</text>
<text x="952.0" y="654.0" class="pinl" text-anchor="start" >GND</text>
<polyline points="834.0,236.0 834.0,190.0 910.0,190.0 910.0,634.0 939.0,634.0" class="w p5 thick"/>
<circle cx="834.0" cy="236.0" r="3.6" class="end p5 thick"/>
<circle cx="939.0" cy="634.0" r="3.6" class="end p5 thick"/>
<polyline points="834.0,476.0 834.0,430.0 912.0,430.0 912.0,650.0 939.0,650.0" class="w gnd thick"/>
<circle cx="834.0" cy="476.0" r="3.6" class="end gnd thick"/>
<circle cx="939.0" cy="650.0" r="3.6" class="end gnd thick"/>
<text x="1286.0" y="658.0" class="small" text-anchor="end" >22 AWG, ≤ 50 cm</text>
<rect x="24" y="730" width="1272" height="112" rx="10" class="foot"/>
<text x="40.0" y="756.0" class="t" text-anchor="start" >Worst case: 0.5 + 0.2 + 0.65 + 1.44 ≈ 2.75 A (every maximum at once), within the charger's 3 A. Normal use: about 0.3 A idle, 1.4 A during a welcome.</text>
<text x="40.0" y="780.0" class="t" text-anchor="start" >Lever connectors: strip 11 mm, twist the strands, push in fully, close the lever and tug. Don't tin wires going into lever connectors or screw terminals.</text>
<text x="40.0" y="804.0" class="t" text-anchor="start" >Colours: red for 5 V, black for ground, everywhere. Keep each 5 V wire next to its ground wire.</text>
<text x="40.0" y="828.0" class="t" text-anchor="start" >The ESP32's USB and the 5 V supply must never power it together: pull the ESP32's 5 V wire (marked !) before plugging USB into the ESP32.</text>
</svg>
