</g>
<g transform="translate(0 -220)">
<rect x="300" y="400" width="380" height="200" rx="10" class="opt"/>
<text x="316.0" y="426.0" class="h3" text-anchor="start" >Option A: USB-C PD trigger (CH224K)</text>
<text x="316.0" y="446.0" class="t" text-anchor="start" >5–20 V DIP switch: set, check, lock.</text>
<text x="316.0" y="482.0" class="ok" text-anchor="start" >Set 5 V from the</text>
<text x="316.0" y="498.0" class="t" text-anchor="start" >board's own table</text>
<text x="316.0" y="526.0" class="ok" text-anchor="start" >Cover the switch</text>
<text x="316.0" y="542.0" class="t" text-anchor="start" >with Kapton tape</text>
<text x="316.0" y="558.0" class="t" text-anchor="start" >or hot glue</text>
<rect x="460" y="460" width="200" height="120" rx="8" class="pcbg"/>
<rect x="520" y="456" width="44" height="14" rx="4" class="usbc"/>
<rect x="478" y="492" width="96" height="38" rx="4" class="dip"/>
<rect x="488" y="498" width="18" height="26" rx="2" class="dipsl"/>
