<rect width="1320" height="860" class="bg"/>
<text x="24.0" y="36.0" class="title" text-anchor="start" >MagicBand Reader: power</text>
<text x="24.0" y="58.0" class="sub" text-anchor="start" >The same for every build. Each load gets its own wires from the hubs; every ground meets at the GND hub.</text>
<rect x="24" y="96" width="220" height="92" rx="10" class="chg"/>
<text x="40.0" y="124.0" class="h3w" text-anchor="start" >USB-C charger</text>
<text x="40.0" y="144.0" class="tw" text-anchor="start" >20 W or more, e.g. a laptop</text>
<text x="40.0" y="160.0" class="tw" text-anchor="start" >USB-C charger or Apple 20 W.</text>
<text x="40.0" y="176.0" class="tw" text-anchor="start" >At 5 V it gives up to 3 A.</text>
<path d="M244 142 C 268 142, 270 250, 300 250" class="cable"/>
<path d="M244 142 C 268 142, 270 470, 300 470" class="cable"/>
<text x="250.0" y="300.0" class="small" text-anchor="start" transform="rotate(90 250 300)">USB-C cable</text>
<g transform="translate(0 220)">
<rect x="300" y="180" width="380" height="200" rx="10" class="opt"/>
<text x="316.0" y="206.0" class="h3" text-anchor="start" >Option B: Adafruit HUSB238 (5807)</text>
<text x="316.0" y="226.0" class="t" text-anchor="start" >Solder jumpers: can't change by accident.</text>
<text x="316.0" y="262.0" class="ok" text-anchor="start" >Keep 5V closed</text>
<text x="316.0" y="278.0" class="t" text-anchor="start" >(never cut it: that</text>
<text x="316.0" y="294.0" class="t" text-anchor="start" >asks for up to 20 V)</text>
<text x="316.0" y="322.0" class="ok" text-anchor="start" >Cut 1A, leave 2A</text>
<text x="316.0" y="338.0" class="t" text-anchor="start" >open = 3 A</text>
