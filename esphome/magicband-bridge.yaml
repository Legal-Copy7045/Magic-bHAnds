# MagicBand+ Bridge: ESP32-S3 that broadcasts MagicBand+ BLE light/haptic
# commands, controlled from Home Assistant.
#
# Most people never need to touch this file:
#   1. Flash from the web installer (see README), enter Wi-Fi in the browser.
#   2. Home Assistant discovers the device. Click Add.
#   3. Optional: "Take control" in the ESPHome dashboard. That imports this
#      file as a package so you can customise it.

substitutions:
  # The clocks' zone until the "Time zone" setting is applied (IANA name).
  timezone: America/New_York
  name: magicband-bridge
  friendly_name: MagicBand Bridge
  project_version: "0.10.33"
  # (The magicband component's source is the add-on's `component_source`
  # substitution; CI and local builds override it with
  # `-s component_source ../components`.)
  firmware_manifest: https://legal-copy7045.github.io/Magic-bHAnds/manifest.json

packages:
  # MagicBand component, actions, Command entity, light and buttons.
  magicband: !include magicband-addon.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  # Each board gets a unique name such as magicband-bridge-3fa2c1, so you can
  # run several for coverage.
  name_add_mac_suffix: true
  project:
    name: legal-copy7045.magicband-bridge
    version: ${project_version}

esp32:
  # ESP32-S3-DevKitC-1 N16R8 layout, e.g. Lonely Binary ESP32-S3 N16R8 IPEX
  # (16 MB flash, 8 MB PSRAM; PSRAM isn't needed).
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# The N16R8 boards have 8 MB of PSRAM. Using it leaves room for Bluetooth and
# the HTTPS download that over-the-air updates need. Boards without PSRAM
# still start (it's skipped if not found).
psram:
  mode: octal
  speed: 80MHz

# Lets the ESPHome dashboard offer "Take control" (adopt) for this device.
dashboard_import:
  package_import_url: github://Legal-Copy7045/Magic-bHAnds/esphome/magicband-bridge.yaml@main
  import_full_config: false

logger:
  # Logs + Improv Wi-Fi setup on the port labelled "UART" (USB-serial chip),
  # the port the web installer uses.
  hardware_uart: UART0

api:
  # Encrypted. Home Assistant gives each board its own key the first time it
  # connects, so there's no key to manage. (Actions come from the add-on.)
  encryption: {}

ota:
  # Updates come from the published firmware through Home Assistant (the
  # Firmware update entity), over the encrypted connection. "Take control" in
  # the ESPHome Device Builder adds its own password-protected upload method.
  - platform: http_request

http_request:

update:
  - platform: http_request
    id: firmware_update
    name: Firmware
    source: ${firmware_manifest}
    update_interval: 6h

wifi:
  # No credentials here: they're entered in the web installer (Improv over
  # USB). The official signed builds add a setup hotspot (an open "ap:" that
  # starts after 2 minutes without Wi-Fi, plus "captive_portal:") in CI's copy
  # only (.github/scripts/signed_build.py): ESPHome's captive portal accepts a
  # firmware upload, which only a signed build refuses from strangers. This
  # file has none, so your own (unsigned) builds don't get one; add both
  # yourself if you want it (a password on "ap:" is wise there).

improv_serial:

# Optional Bluetooth proxy for Home Assistant, controlled by the
# "Bluetooth proxy" switch on the device page (off by default). Scanning
# shares the radio with band broadcasts, so leave it off on boards whose only
# job is reaching bands.
esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    continuous: false   # scanning only starts when the switch is on

bluetooth_proxy:
  active: true

switch:
  # Installs new releases by itself between 03:00 and 04:00 (local time in the
  # "Time zone" setting, by the internet clock), without Home Assistant.
  - platform: template
    id: auto_update
    name: "Automatic updates"
    icon: mdi:update
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: proxy_switch
    name: "Bluetooth proxy"
    icon: mdi:bluetooth-connect
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - esp32_ble_tracker.start_scan:
          continuous: true
    turn_off_action:
      - esp32_ble_tracker.stop_scan:

# Memory, loop time and reset reason for the health sensors below.
debug:
  update_interval: 300s

# The time, from Home Assistant and from an internet time server (sntp_time
# below): for "Last restart" and the automatic-update window.
time:
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}
    on_time_sync:
      - script.execute: apply_time_zone
  # Internet time, so the device keeps local time (and its automatic-update
  # window) without Home Assistant. Both clocks use the "Time zone" setting.
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    on_time_sync:
      - script.execute: apply_time_zone
    on_time:
      # Automatic updates: look for a new release at 02:55, then install it
      # between 03:00 and 04:00 local time, by the internet clock so it doesn't
      # need Home Assistant (tried every 10 minutes, so a failed
      # download gets another go). Only signed releases install (see
      # docs/security.md, "Signed updates"), and only a newer one: the job
      # never goes back to an older signed release. Installing from Home
      # Assistant's Firmware entity is up to you.
      - seconds: 0
        minutes: 55
        hours: 2
        then:
          - if:
              condition:
                switch.is_on: auto_update
              then:
                - component.update: firmware_update
      - seconds: 0
        minutes: /10
        hours: 3
        then:
          - if:
              condition:
                and:
                  - switch.is_on: auto_update
                  - update.is_available: firmware_update
                  - lambda: |-
                      const auto &info = id(firmware_update).update_info;
                      if (magicband::release_newer(info.latest_version, info.current_version)) return true;
                      ESP_LOGW("update", "Automatic update: %s is not newer than %s, not installing",
                               info.latest_version.c_str(), info.current_version.c_str());
                      return false;
              then:
                - logger.log:
                    format: "Automatic update: installing the new release"
                    level: INFO
                - update.perform: firmware_update

sensor:
  # Health (diagnostic). Throttled so Home Assistant's history stays small:
  # each is sent when it changes noticeably, and at most every 5 minutes otherwise.
  - platform: wifi_signal
    name: "Wi-Fi signal"
    entity_category: diagnostic
    update_interval: 60s
    filters:
      - or:
          - delta: 3
          - throttle: 300s
  - platform: internal_temperature
    name: "CPU temperature"
    entity_category: diagnostic
    update_interval: 60s
    filters:
      - or:
          - delta: 1
          - throttle: 300s
  - platform: uptime
    type: timestamp          # the time it started: changes only on a restart
    name: "Last restart"
    entity_category: diagnostic
  - platform: debug
    free:
      name: "Free memory"
      entity_category: diagnostic
    block:
      name: "Largest free block"
      entity_category: diagnostic
    loop_time:
      name: "Loop time"
      entity_category: diagnostic

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset reason"
      entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: "IP address"
      entity_category: diagnostic
    ssid:
      name: "Wi-Fi network"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

select:
  # The local time zone for every clock on the device (automatic updates, and
  # on the reader night mode). Applied at once and kept across restarts.
  - platform: template
    id: time_zone
    name: "Time zone"
    icon: mdi:map-clock
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Eastern (New York)"
    options:   # keep in step with components/magicband/time_zone.h
      - "Eastern (New York)"
      - "Central (Chicago)"
      - "Mountain (Denver)"
      - "Arizona (Phoenix)"
      - "Pacific (Los Angeles)"
      - "Alaska (Anchorage)"
      - "Hawaii (Honolulu)"
      - "UK (London)"
      - "Central Europe (Paris)"
      - "UTC"
    on_value:
      - script.execute: apply_time_zone

script:
  # Applies the "Time zone" setting to the device's clocks.
  - id: apply_time_zone
    then:
      - lambda: |-
          if (!magicband::set_time_zone(id(time_zone).current_option()))
            ESP_LOGW("time", "Unknown time zone: %s", id(time_zone).current_option().c_str());
