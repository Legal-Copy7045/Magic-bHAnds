# MagicBand Reader firmware for the custom PCB (hardware/reader-pcb).
#
# Identical to magicband-reader.yaml (same GPIOs, features and Home Assistant
# integration), except that the PCB has no USB-serial chip: logs and the web
# installer's Wi-Fi setup use the ESP32-S3's native USB port, and it updates
# from its own channel so it never receives the dev-board firmware.
#
# Status: the PCB hasn't been built yet. Build the reader on a breadboard
# first (docs/reader.md).

substitutions:
  name: magicband-reader-pcb   # becomes magicband-reader-pcb-xxxxxx
  firmware_manifest: https://legal-copy7045.github.io/Magic-bHAnds/reader-pcb/manifest.json

packages:
  reader: github://Legal-Copy7045/Magic-bHAnds/esphome/magicband-reader.yaml@main

dashboard_import:
  package_import_url: github://Legal-Copy7045/Magic-bHAnds/esphome/magicband-reader-pcb.yaml@main
  import_full_config: false

logger:
  # The PCB's USB-C goes straight to the ESP32-S3 (native USB).
  hardware_uart: USB_SERIAL_JTAG
