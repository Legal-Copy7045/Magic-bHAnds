    icon: mdi:volume-low
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 30
    min_value: 5
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    on_value:
      - lambda: |-
          if (id(quiet_applied)) {
            auto call = id(reader_speaker).make_call();
            call.set_volume(x / 100.0f);
            call.perform();
