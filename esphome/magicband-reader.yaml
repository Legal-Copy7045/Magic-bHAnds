  - platform: template
    id: night_from
    name: "Night from"
    icon: mdi:weather-sunset-down
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 22
    min_value: 0
    max_value: 23
    step: 1
    unit_of_measurement: "h"
    mode: box
