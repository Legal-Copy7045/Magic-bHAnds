# ---------------------------------------------------------------------------
# Sound: MAX98357A I2S amplifier + small speaker, playing your own sound files
# ---------------------------------------------------------------------------
# The sound files (see substitutions) are embedded in the firmware at build
# time, so they play instantly with no network involved. Mono 16-bit
# WAV/FLAC/MP3 under 5 MB each; see docs/reader.md.
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO5   # MAX98357A LRC
    i2s_bclk_pin: GPIO6    # MAX98357A BCLK

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO7
    dac_type: external
    channel: mono

media_player:
  # Also usable from Home Assistant (announcements, TTS).
  - platform: speaker
    id: reader_speaker
    name: "Speaker"
    volume_initial: 70%
    announcement_pipeline:
      speaker: spk
      num_channels: 1
    files:
      - id: snd_startup
        file: ${sound_startup}
      - id: snd_tap_in
        file: ${sound_tap_in}
      - id: snd_error
        file: ${sound_error}

# ---------------------------------------------------------------------------
# Behaviour
# ---------------------------------------------------------------------------
globals:
  # False until boot has finished. The LED settings restore their values during
  # set-up, before the ring's driver is ready; touching the ring then crashes.
  - id: ring_ready
    type: bool
    initial_value: "false"
  - id: pulse_count       # how many times the "Pulse" effect fades up and down
    type: int
    initial_value: "1"
  - id: rgb               # the colour chosen by set_ring_colour: r, g, b, white (0-1)
    type: std::array<float, 4>
    initial_value: "{1.0f, 1.0f, 1.0f, 0.0f}"
  - id: decision          # 0 = waiting, 1 = accept, 2 = deny
    type: int
    initial_value: "0"
  # Allowed bands for "Known bands only": ",UID,UID," with IDs uppercase and
  # without separators. Stored on the reader, so it survives restarts and
  # works with Home Assistant offline. Room for 213 bands with 7-byte IDs
  # (READER_LIST_CAPACITY in the integration must match: size - 1).
  - id: known_list
    type: std::array<char, 3200>
    restore_value: true
    update_interval: 5s
  - id: pair_key          # the MagicbHAnds integration's key ("" = not paired; see the pair action)
    type: magicband::ReaderKey
    restore_value: true
  - id: pending_key       # a first pairing waiting for its confirming tap (not kept through restarts)
    type: magicband::ReaderKey
  - id: pending_until
    type: uint32_t
    initial_value: "0"
  - id: show_calls        # recent play_show actions (at most 12 a minute)
    type: magicband::RateLimit<12>
  - id: unknown_tags      # unknown bands recently reported to Home Assistant (see band_tapped)
    type: magicband::UnknownTagLimit
  # Bands that have been on the allowed list (the last 128, as hashes; kept
  # through restarts): their taps always reach Home Assistant, also while
  # they're off the list (outside their hours, a lockdown). See band_tapped.
  - id: listed_bands
    type: magicband::ListedBands<128>
    restore_value: true
  - id: sync_error        # why the last set_known_bands failed ("" = applied)
    type: std::string
  # Each allowed band's owner's welcome colour: ",UID=Colour,UID=Colour,"
  # (from the MagicBand integration's set_band_colours).
  - id: band_colours
    type: std::array<char, 4096>
    restore_value: true
  - id: welcome_name      # the colour this tap is welcomed in
    type: std::string
  # The allowed bands whose owner has a welcome sound of their own: ",UID,UID,"
  # (from the MagicBand integration's set_band_sounds). The reader doesn't play
  # its tap-in sound for them; MagicbHAnds plays theirs on this speaker.
  - id: band_sounds
    type: std::array<char, 1600>
    restore_value: true
  - id: own_sound         # this tap's band has its own welcome sound
    type: bool
    initial_value: "false"
  # "Sound at night" Quieter: the speaker volume before night started, so the
  # morning puts it back (kept through restarts, as is whether it's applied).
  - id: day_volume
    type: float
    restore_value: true
    initial_value: "0.7"
  - id: quiet_applied
    type: bool
    restore_value: true
    initial_value: "false"
  # "Refused-tap lockout": when each recent refusal happened (millis), and
  # until when taps are ignored (0 = not locked out).
  - id: refusal_times
    type: std::array<uint32_t, 20>
  - id: lockout_until
    type: uint32_t
    initial_value: "0"
  - id: show_on           # a light show is playing (see play_show)
    type: bool
    initial_value: "false"
  - id: show_index        # which one (components/magicband/shows.h)
    type: int
    initial_value: "0"
  - id: night             # inside the night hours (see update_night)
    type: bool
    initial_value: "false"
  # Today's sunset and sunrise, minutes after local midnight, from Home
  # Assistant's sun (sun.sun). Kept through restarts, so "Sunset to sunrise"
  # keeps working while Home Assistant is away; -1 = not known yet.
  - id: sunset_min
    type: int
    restore_value: true
    initial_value: "-1"
  - id: sunrise_min
    type: int
    restore_value: true
    initial_value: "-1"

select:
  # The local time zone for every clock on the device (automatic updates, and
  # on the reader night mode). Applied at once and kept across restarts.
  - platform: template
    id: time_zone
    name: "Time zone"
    icon: mdi:map-clock
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Eastern (New York)"
    options:   # keep in step with components/magicband/time_zone.h
      - "Eastern (New York)"
      - "Central (Chicago)"
      - "Mountain (Denver)"
      - "Arizona (Phoenix)"
      - "Pacific (Los Angeles)"
      - "Alaska (Anchorage)"
      - "Hawaii (Honolulu)"
      - "UK (London)"
      - "Central Europe (Paris)"
      - "UTC"
    on_value:
      - script.execute: apply_time_zone
  # The light show played when the reader starts (Off, Random or one show).
  - platform: template
    id: startup_show
    name: "Startup show"
    icon: mdi:creation
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Rainbow rush"
    options:
      - "Off"
      - "Random"
      - "Rainbow rush"
      - "Fireworks"
      - "Comet chase"
      - "Colour parade"
      - "Twinkle"
      - "Heartbeat"
      - "Ocean"
      - "Fire"
      - "Pinwheel"
      - "Confetti"
      - "Penguins"
      - "Goal"
      - "Aurora"
      - "Candy cane"
      - "Thunderstorm"
      - "Sunrise"
      - "Disco"
      - "Birthday"
      - "New Year"
      - "Valentine"
      - "St Patrick"
      - "Easter"
      - "Stars and Stripes"
      - "Halloween"
      - "Thanksgiving"
      - "Hanukkah"
      - "Christmas"
      - "Stamp"
  # The light show "Play show" plays (Random = a different one each time).
  - platform: template
    id: show_choice
    name: "Show"
    icon: mdi:palette-swatch-variant
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Random"
    options:
      - "Random"
      - "Rainbow rush"
      - "Fireworks"
      - "Comet chase"
      - "Colour parade"
      - "Twinkle"
      - "Heartbeat"
      - "Ocean"
      - "Fire"
      - "Pinwheel"
      - "Confetti"
      - "Penguins"
      - "Goal"
      - "Aurora"
      - "Candy cane"
      - "Thunderstorm"
      - "Sunrise"
      - "Disco"
      - "Birthday"
      - "New Year"
      - "Valentine"
      - "St Patrick"
      - "Easter"
      - "Stars and Stripes"
      - "Halloween"
      - "Thanksgiving"
      - "Hanukkah"
      - "Christmas"
      - "Stamp"
  # When "Idle glow at night" applies: between "Night from" and "Night until",
  # or from sunset to sunrise (each moved by its offset in minutes). The sun
  # times come from Home Assistant's sun; until it has sent them, the set
  # hours are used.
  - platform: template
    id: night_mode
    name: "Night mode"
    icon: mdi:weather-night
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Set hours"
    options:
      - "Set hours"
      - "Sunset to sunrise"
    on_value:
      - script.execute: update_night
  # How far the welcome's light-up reaches. Every MagicBand+ in range reacts,
  # so lower it until only the band on the reader lights up. Each -6 dB
  # roughly halves the reach; -24 dBm is about arm's length or less.
  - platform: template
    id: band_power
    name: "Band light-up power"
    icon: mdi:signal-distance-variant
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "-12 dBm"
    options:
      - "-24 dBm"
      - "-21 dBm"
      - "-18 dBm"
      - "-15 dBm"
      - "-12 dBm"
      - "-9 dBm"
      - "-6 dBm"
      - "-3 dBm"
      - "0 dBm"
    on_value:
      - lambda: |-
          int dbm = atoi(x.c_str());
          if (dbm < -24 || dbm > 0) dbm = -12;
          // ESP32-S3 power levels: index 0 = -24 dBm, in 3 dB steps.
          id(band).set_tx_power(static_cast<esp_power_level_t>((dbm + 24) / 3), dbm);
          ESP_LOGI("reader", "Band light-up power: %d dBm", dbm);
  # The ring's tap sequence: checking colour, then the welcome or denied
  # colour (see the "Chase" and "Pulse" effects and the number settings).
  - platform: template
    id: checking_colour
    name: "Checking colour"
    icon: mdi:palette-outline
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "White"
    options:
      - "White"
      - "Warm white"
      - "Red"
      - "Orange"
      - "Yellow"
      - "Green"
      - "Cyan"
      - "Blue"
      - "Purple"
      - "Pink"
      - "Magenta"
  - platform: template
    id: idle_colour
    name: "Idle colour"
    icon: mdi:palette-outline
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "White"
    options:
      - "White"
      - "Warm white"
      - "Red"
      - "Orange"
      - "Yellow"
      - "Green"
      - "Cyan"
      - "Blue"
      - "Purple"
      - "Pink"
      - "Magenta"
    on_value:
      # Not before boot has finished (restoring the setting at start-up runs
      # this too, and the ring isn't set up yet: see ring_ready), nor during a tap.
      - if:
          condition:
            and:
              - lambda: 'return id(ring_ready);'
              - not:
                  script.is_running: band_tapped
          then:
            - script.execute: reader_idle
  # How the ring waits for a band: a steady glow, or a circle going round
  # (in "Idle colour" at "Idle glow", one circle per "Idle circle time").
  - platform: template
    id: idle_style
    name: "Idle style"
    icon: mdi:rotate-right
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Static"
    options:
      - "Static"
      - "Circle"
    on_value:
      - if:
          condition:
            and:
              - lambda: 'return id(ring_ready);'
              - not:
                  script.is_running: band_tapped
          then:
            - script.execute: reader_idle
  # Which way the idle circle goes round.
  - platform: template
    id: idle_circle_direction
    name: "Idle circle direction"
    icon: mdi:swap-horizontal
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Forward"
    options:
      - "Forward"
      - "Reverse"
  # At night ("Night now"): the idle style to use instead, or the day's.
  - platform: template
    id: idle_style_night
    name: "Idle style at night"
    icon: mdi:weather-night
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Same as day"
    options:
      - "Same as day"
      - "Static"
      - "Circle"
    on_value:
      - if:
          condition:
            and:
              - lambda: 'return id(ring_ready);'
              - not:
                  script.is_running: band_tapped
          then:
            - script.execute: reader_idle
  # Quiet hours, on the night schedule ("Night now"): Normal, Quieter (the
  # speaker at "Night volume" until morning) or Off (no reader sounds at night).
  - platform: template
    id: sound_at_night
    name: "Sound at night"
    icon: mdi:volume-low
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Normal"
    options:
      - "Normal"
      - "Quieter"
      - "Off"
    on_value:
      - script.execute: apply_quiet
  - platform: template
    id: welcome_colour
    name: "Welcome colour"
    icon: mdi:palette
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Green"
    options:
      - "White"
      - "Warm white"
      - "Red"
      - "Orange"
      - "Yellow"
      - "Green"
      - "Cyan"
      - "Blue"
      - "Purple"
      - "Pink"
      - "Magenta"
  - platform: template
    id: denied_colour
    name: "Denied colour"
    icon: mdi:palette-swatch
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Red"
    options:
      - "White"
      - "Warm white"
      - "Red"
      - "Orange"
      - "Yellow"
      - "Green"
      - "Cyan"
      - "Blue"
      - "Purple"
      - "Pink"
      - "Magenta"
  - platform: template
    id: response_mode
    name: "Response mode"
    icon: mdi:account-check
    entity_category: config
    optimistic: true
    restore_value: true
    # Default: only bands on the reader's list are welcomed. A new band's first
    # scan gets the denied sequence; allow it with "Allow last band".
    initial_option: "Known bands only"
    options:
      - "Known bands only"
      - "Welcome every band"
      - "Ask Home Assistant"
  # What the ring's LEDs are. RGBW rings (SK6812 RGBW) have a white LED in
  # each pixel, warm, neutral or cool; White and Warm white use it. Changing
  # this restarts the reader, so Home Assistant sees the Ring light's new
  # colour modes.
  - platform: template
    id: ring_type
    name: "Ring type"
    icon: mdi:led-on
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: ${ring_type}
    options:
      - "RGB"
      - "RGBW warm white"
      - "RGBW neutral white"
      - "RGBW cool white"
    on_value:
      - if:
          condition:
            lambda: 'return id(ring_ready);'
          then:
            - logger.log:
                format: "Ring type is now %s: restarting"
                args: ['x.c_str()']
                level: INFO
            - delay: 1s
            - lambda: 'App.safe_reboot();'
  - platform: template
    id: ring_order
    name: "LED colour order"
    icon: mdi:palette
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: ${ring_color_order}
    options:
      - "GRB"
      - "RGB"
    on_value:
      - if:
          condition:
            lambda: 'return id(ring_ready);'
          then:
            - script.execute: apply_ring_settings
            # Not during a tap: the welcome or denied sequence finishes first.
            - if:
                condition:
                  not:
                    script.is_running: band_tapped
                then:
                  - script.execute: reader_idle

