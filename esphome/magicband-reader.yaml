  - platform: template
    id: ring_brightness
    name: "LED brightness"
    icon: mdi:brightness-6
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 100
    min_value: 5
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    on_value:
      - if:
          condition:
            lambda: 'return id(ring_ready);'
