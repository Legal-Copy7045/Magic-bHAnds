    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 1
    max_value: 5
    step: 1
    mode: box
  # The welcome's shape: how fast it comes on, how long it stays, how slowly it goes.
  - platform: template
    id: welcome_fade_in
    name: "Welcome fade in"
    icon: mdi:transition
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0.15
    min_value: 0
    max_value: 2
    step: 0.05
    unit_of_measurement: "s"
    mode: box
  - platform: template
    id: welcome_hold
    name: "Welcome hold"
    icon: mdi:timer-outline
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 0
    max_value: 10
    step: 0.1
    unit_of_measurement: "s"
    mode: box
  - platform: template
    id: welcome_fade_out
    name: "Welcome fade out"
    icon: mdi:transition
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 0
    max_value: 5
    step: 0.05
    unit_of_measurement: "s"
    mode: box
  - platform: template
    id: denied_pulses
    name: "Denied pulses"
    icon: mdi:pulse
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 2
    min_value: 1
    max_value: 5
    step: 1
    mode: box
  - platform: template
    id: pulse_time
    name: "Pulse time"
    icon: mdi:timer-sand
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0.45
    min_value: 0.2
    max_value: 1.5
    step: 0.05
    unit_of_measurement: "s"
    mode: box
  - platform: template
    id: ring_count
    name: "LED count"
    icon: mdi:led-strip-variant
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ${ring_leds}
    min_value: 1
    max_value: ${ring_max_leds}
    step: 1
    mode: box
    on_value:
      - if:
          condition:
            lambda: 'return id(ring_ready);'
          then:
            - script.execute: apply_ring_settings
            # Not during a tap: the welcome or denied sequence finishes first.
            - if:
                condition:
                  not:
                    script.is_running: band_tapped
                then:
                  - script.execute: reader_idle
  # Scales everything the ring shows (spin, welcome, deny, idle glow, and the
