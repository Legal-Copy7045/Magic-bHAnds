# MagicBand Reader: a park-style touch point for Home Assistant.
#
# Tap an original MagicBand or a MagicBand+ on the reader:
#   1. The ring spins while the band is read (NFC, both band types).
#   2. Home Assistant gets the band's ID as a Tag scan, so any automation
#      can react to it (lights, locks, music, ...).
#   3. Welcome: ring and Mickey turn green, the tap-in sound plays, and a MagicBand+
#      also lights up green and buzzes (Bluetooth, via the magicband add-on).
#      Denied (in "Known bands only" or "Ask Home Assistant" mode): red flash
#      and the error sound. Everything except "Ask Home Assistant" is decided
#      on the reader, with no round trip to Home Assistant.
# A start-up sound plays on boot. Sound files: see docs/reader.md.
#
# Hardware and wiring: docs/reader.md
# Secrets needed in the Device Builder's secrets.yaml:
#   wifi_ssid, wifi_password, reader_api_key (32-byte base64)

substitutions:
  name: magicband-reader
  friendly_name: MagicBand Reader
  ring_leds: 24       # LEDs in the ring
  mickey_leds: 12     # LEDs in the Mickey head, wired after the ring
  # Sound files: downloaded from this repo at build time. To use your own,
  # point these at a URL or a path next to this config (e.g. sounds/my.wav).
  sound_startup: https://raw.githubusercontent.com/Legal-Copy7045/Magic-bHAnds/main/esphome/sounds/startup.wav
  sound_tap_in: https://raw.githubusercontent.com/Legal-Copy7045/Magic-bHAnds/main/esphome/sounds/tap_in.wav
  sound_error: https://raw.githubusercontent.com/Legal-Copy7045/Magic-bHAnds/main/esphome/sounds/error.wav

packages:
  # MagicBand+ Bluetooth component, its actions/entities and Command entity.
  magicband: github://Legal-Copy7045/Magic-bHAnds/esphome/magicband-addon.yaml@main

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  # Lets the MagicBand integration recognise this device as a reader.
  project:
    name: legal-copy7045.magicband-reader
    version: "0.6.0"
  on_boot:
    priority: -100
    then:
      - script.execute: reader_idle
      - if:
          condition:
            switch.is_on: sound_enabled
          then:
            - media_player.speaker.play_on_device_media_file:
                media_file: snd_startup
                announcement: true

esp32:
  # ESP32-S3-DevKitC-1 N16R8 layout, e.g. Lonely Binary ESP32-S3 N16R8.
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret reader_api_key
  actions:
    # For "Ask Home Assistant" mode: an automation on the tag scan calls one
    # of these within 3 seconds (esphome.magicband_reader_accept / _deny).
    - action: accept
      then:
        - globals.set: {id: decision, value: "1"}
    - action: deny
      then:
        - globals.set: {id: decision, value: "2"}
    # Used by the MagicBand integration to replace the reader's allowed list.
    # bands: comma-separated band IDs (any of 04-53-65-.., 0453652A.. forms).
    - action: set_known_bands
      variables:
        bands: string
      then:
        - lambda: |-
            std::string out = ",";
            std::string cur;
            for (char c : std::string(bands) + ",") {
              if (c == ',') {
                if (!cur.empty()) out += cur + ",";
                cur.clear();
              } else if (std::isalnum(static_cast<unsigned char>(c))) {
                cur += static_cast<char>(std::toupper(static_cast<unsigned char>(c)));
              }
            }
            if (out.size() >= id(known_list).size()) {
              ESP_LOGE("reader", "Too many bands (%u chars); list not changed", (unsigned) out.size());
              return;
            }
            std::fill(id(known_list).begin(), id(known_list).end(), 0);
            std::copy(out.begin(), out.end(), id(known_list).begin());
            ESP_LOGI("reader", "Known bands updated: %s", out.c_str());
        - component.update: known_band_count

ota:
  - platform: esphome
    encryption: {}   # required; reuses the api key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "MagicBand Reader Setup"

captive_portal:

# Feedback to MagicBand+ is meant for the band on the reader, so keep the
# Bluetooth power low (the add-on defaults to max for whole-room bridges).
magicband:
  tx_power: 0dBm

# ---------------------------------------------------------------------------
# NFC reader: PN532 on I2C (set the module's switches to I2C mode)
# ---------------------------------------------------------------------------
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

pn532_i2c:
  id: nfc_reader
  update_interval: 250ms
  on_tag:
    then:
      - script.execute:
          id: band_tapped
          uid: !lambda 'return x;'

# ---------------------------------------------------------------------------
# LEDs: one WS2812B chain: ring first, then the Mickey head
# ---------------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    id: led_chain
    internal: true
    pin: GPIO4
    chipset: WS2812
    channel_colors: GRB
    num_leds: ${ring_leds + mickey_leds}
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

  - platform: partition
    id: ring
    name: "Ring"
    default_transition_length: 300ms
    restore_mode: ALWAYS_OFF
    segments:
      - id: led_chain
        from: 0
        to: ${ring_leds - 1}
    effects:
      - addressable_lambda:
          name: "Spin"
          update_interval: 25ms
          lambda: |-
            static int pos = 0;
            if (initial_run) pos = 0;
            const int n = it.size();
            it.all() = Color::BLACK;
            for (int t = 0; t < 8; t++) {
              int i = ((pos - t) % n + n) % n;
              it[i] = current_color * static_cast<uint8_t>(255 - t * 30);
            }
            pos = (pos + 1) % n;
      - addressable_lambda:
          name: "Breathe"
          update_interval: 30ms
          lambda: |-
            static uint16_t phase = 0;
            phase = (phase + 3) % 512;
            uint8_t level = phase < 256 ? phase : 511 - phase;
            it.all() = current_color * static_cast<uint8_t>(20 + level / 2);
      - strobe:
          name: "Deny flash"
          colors:
            - state: true
              red: 100%
              green: 0%
              blue: 0%
              duration: 150ms
            - state: false
              duration: 150ms

  - platform: partition
    id: mickey
    name: "Mickey"
    default_transition_length: 300ms
    restore_mode: ALWAYS_OFF
    segments:
      - id: led_chain
        from: ${ring_leds}
        to: ${ring_leds + mickey_leds - 1}

# ---------------------------------------------------------------------------
# Sound: MAX98357A I2S amplifier + small speaker, playing your own sound files
# ---------------------------------------------------------------------------
# The sound files (see substitutions) are embedded in the firmware at build
# time, so they play instantly with no network involved. Mono 16-bit
# WAV/FLAC/MP3 under 5 MB each; see docs/reader.md.
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO5   # MAX98357A LRC
    i2s_bclk_pin: GPIO6    # MAX98357A BCLK

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO7
    dac_type: external
    channel: mono

media_player:
  # Also usable from Home Assistant (announcements, TTS).
  - platform: speaker
    id: reader_speaker
    name: "Speaker"
    volume_initial: 70%
    announcement_pipeline:
      speaker: spk
      num_channels: 1
    files:
      - id: snd_startup
        file: ${sound_startup}
      - id: snd_tap_in
        file: ${sound_tap_in}
      - id: snd_error
        file: ${sound_error}

# ---------------------------------------------------------------------------
# Behaviour
# ---------------------------------------------------------------------------
globals:
  - id: decision          # 0 = waiting, 1 = accept, 2 = deny
    type: int
    initial_value: "0"
  # Allowed bands for "Known bands only": ",UID,UID," with IDs uppercase and
  # without separators. Stored on the reader, so it survives restarts and
  # works with Home Assistant offline. Room for ~100 bands.
  - id: known_list
    type: std::array<char, 1600>
    restore_value: true
    update_interval: 5s

select:
  - platform: template
    id: response_mode
    name: "Response mode"
    icon: mdi:account-check
    entity_category: config
    optimistic: true
    restore_value: true
    # Default: only bands on the reader's list are welcomed. A new band's first
    # scan gets the denied sequence; allow it with "Allow last band".
    initial_option: "Known bands only"
    options:
      - "Known bands only"
      - "Welcome every band"
      - "Ask Home Assistant"

switch:
  - platform: template
    id: light_up_band
    name: "Light up MagicBand+"
    icon: mdi:watch-variant
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: sound_enabled
    name: "Sound"
    icon: mdi:volume-high
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

event:
  # Logs every scan in Home Assistant's logbook as welcomed or denied.
  - platform: template
    id: band_scan
    name: "Band scan"
    icon: mdi:nfc-search-variant
    event_types:
      - "welcomed"
      - "denied"

sensor:
  - platform: template
    id: known_band_count
    name: "Known bands"
    icon: mdi:account-multiple-check
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      std::string list(id(known_list).data());
      int n = 0;
      for (size_t i = 1; i < list.size(); i++) if (list[i] == ',') n++;
      return n;

text_sensor:
  - platform: template
    id: last_band
    name: "Last band"
    icon: mdi:nfc-variant

script:
  - id: reader_idle
    then:
      - light.turn_off: ring
      - light.turn_on:
          id: mickey
          brightness: 25%
          red: 100%
          green: 100%
          blue: 100%

  - id: band_tapped
    mode: single            # ignore taps while a sequence is playing
    parameters:
      uid: string
    then:
      - text_sensor.template.publish:
          id: last_band
          state: !lambda 'return uid;'
      - homeassistant.tag_scanned: !lambda 'return uid;'
      - globals.set: {id: decision, value: "0"}
      - light.turn_on:
          id: ring
          effect: "Spin"
          brightness: 100%
          red: 100%
          green: 100%
          blue: 100%
      - if:
          condition:
            lambda: 'return id(response_mode).current_option() == "Known bands only";'
          then:
            # Decided on the reader: no round trip to Home Assistant.
            - delay: 800ms
            - lambda: |-
                std::string key;
                for (char c : uid)
                  if (std::isalnum(static_cast<unsigned char>(c)))
                    key += static_cast<char>(std::toupper(static_cast<unsigned char>(c)));
                std::string list(id(known_list).data());
                id(decision) = (!key.empty() && list.find("," + key + ",") != std::string::npos) ? 1 : 2;
      - if:
          condition:
            lambda: 'return id(response_mode).current_option() == "Ask Home Assistant";'
          then:
            - wait_until:
                condition:
                  lambda: 'return id(decision) != 0;'
                timeout: 3s
            - if:
                condition:
                  lambda: 'return id(decision) == 0;'
                then:
                  - globals.set: {id: decision, value: "2"}   # no answer: deny
      - if:
          condition:
            lambda: 'return id(response_mode).current_option() == "Welcome every band";'
          then:
            - delay: 800ms
            - globals.set: {id: decision, value: "1"}
      - if:
          condition:
            lambda: 'return id(decision) == 1;'
          then:
            - event.trigger: {id: band_scan, event_type: "welcomed"}
            - script.execute: reader_welcome
            - script.wait: reader_welcome
          else:
            - event.trigger: {id: band_scan, event_type: "denied"}
            - script.execute: reader_deny
            - script.wait: reader_deny
      - script.execute: reader_idle

  - id: reader_welcome
    then:
      - light.turn_on: {id: ring, effect: "None", brightness: 100%, red: 0%, green: 100%, blue: 0%}
      - light.turn_on: {id: mickey, brightness: 100%, red: 0%, green: 100%, blue: 0%}
      - if:
          condition:
            switch.is_on: sound_enabled
          then:
            - media_player.speaker.play_on_device_media_file:
                media_file: snd_tap_in
                announcement: true
      - if:
          condition:
            switch.is_on: light_up_band
          then:
            - lambda: |-
                id(band).send_single_color(magicband::GREEN, 2,
                    magicband::MagicBand::timing(6, 1, false));
      - delay: 3s

  - id: reader_deny
    then:
      - light.turn_on: {id: ring, effect: "Deny flash", brightness: 100%, red: 100%, green: 0%, blue: 0%}
      - light.turn_on: {id: mickey, brightness: 100%, red: 100%, green: 0%, blue: 0%}
      - if:
          condition:
            switch.is_on: sound_enabled
          then:
            - media_player.speaker.play_on_device_media_file:
                media_file: snd_error
                announcement: true
      - delay: 2s

button:
  # Manage the reader's own list from its device page: tap a band, then press.
  # With the MagicBand integration, manage bands there instead: it replaces
  # this list whenever it syncs.
  - platform: template
    name: "Allow last band"
    icon: mdi:account-plus
    entity_category: config
    on_press:
      - lambda: |-
          std::string key;
          for (char c : id(last_band).state)
            if (std::isalnum(static_cast<unsigned char>(c)))
              key += static_cast<char>(std::toupper(static_cast<unsigned char>(c)));
          if (key.empty() || key == "TEST") return;
          std::string list(id(known_list).data());
          if (list.empty()) list = ",";
          if (list.find("," + key + ",") != std::string::npos) return;
          list += key + ",";
          if (list.size() >= id(known_list).size()) { ESP_LOGW("reader", "Known bands list is full"); return; }
          std::fill(id(known_list).begin(), id(known_list).end(), 0);
          std::copy(list.begin(), list.end(), id(known_list).begin());
          ESP_LOGI("reader", "Allowed band %s", key.c_str());
      - component.update: known_band_count
  - platform: template
    name: "Forget last band"
    icon: mdi:account-minus
    entity_category: config
    on_press:
      - lambda: |-
          std::string key;
          for (char c : id(last_band).state)
            if (std::isalnum(static_cast<unsigned char>(c)))
              key += static_cast<char>(std::toupper(static_cast<unsigned char>(c)));
          std::string list(id(known_list).data());
          size_t pos = list.find("," + key + ",");
          if (key.empty() || pos == std::string::npos) return;
          list.erase(pos, key.size() + 1);
          std::fill(id(known_list).begin(), id(known_list).end(), 0);
          std::copy(list.begin(), list.end(), id(known_list).begin());
          ESP_LOGI("reader", "Forgot band %s", key.c_str());
      - component.update: known_band_count
  - platform: template
    name: "Forget all bands"
    icon: mdi:account-multiple-remove
    entity_category: config
    on_press:
      - lambda: 'std::fill(id(known_list).begin(), id(known_list).end(), 0);'
      - component.update: known_band_count
  - platform: template
    name: "Test welcome"
    icon: mdi:check-circle
    on_press:
      - script.execute:
          id: band_tapped
          uid: "TEST"
  - platform: restart
    name: "Restart"
    entity_category: diagnostic
