# MagicBand Reader: a park-style touch point for Home Assistant.
#
# Tap an original MagicBand or a MagicBand+ on the reader:
#   1. Two quick white circles chase round the ring while the band is read
#      and checked (NFC, both band types).
#   2. Home Assistant gets the band's ID as a Tag scan, so any automation
#      can react to it (lights, locks, music, ...).
#   3. Welcome: the ring pulses in the welcome colour (or the owner's own
#      colour, from the MagicbHAnds integration), the tap-in sound plays, and
#      a MagicBand+ lights up in the same colour and buzzes (Bluetooth, via
#      the magicband add-on). Denied (in "Known bands only" or "Ask Home
#      Assistant" mode): two red pulses and the error sound. Everything except "Ask Home Assistant" is decided
#      on the reader, with no round trip to Home Assistant.
# A start-up sound plays on boot. Sound files: see docs/reader.md.
#
# Hardware and wiring: docs/reader.md
# Install: the web installer (https://legal-copy7045.github.io/Magic-bHAnds/)
# needs no secrets: Wi-Fi is set in the browser, and Home Assistant discovers
# the reader. "Take control" in the ESPHome Device Builder to customise it.

substitutions:
  name: magicband-reader
  friendly_name: MagicBand Reader
  project_version: "0.10.16"
  firmware_manifest: https://legal-copy7045.github.io/Magic-bHAnds/reader/manifest.json
  # LED ring or strip. These are only the first-boot defaults: "LED count" and
  # "LED colour order" are settings on the reader's device page, so the web
  # installer's firmware fits any ring. With more than 24 LEDs the reader caps
  # their output automatically (24 / count) so full white stays within the
  # 20 W budget (1.44 A, i.e. 24 LEDs at 60 mA). See hardware/shopping-list.md.
  ring_leds: "24"
  ring_color_order: GRB  # GRB for most NeoPixels; RGB for Adafruit's silicone neon-like strip (4310)
  ring_type: RGB         # first-boot default for "Ring type": RGB, or RGBW warm/neutral/cool white
  ring_max_leds: "100"   # the most LEDs the "LED count" setting allows
  # Sound files: downloaded from this repo at build time. To use your own,
  # point these at a URL or a path next to this config (e.g. sounds/my.wav).
  sound_startup: https://raw.githubusercontent.com/Legal-Copy7045/Magic-bHAnds/main/esphome/sounds/startup.wav
  sound_tap_in: https://raw.githubusercontent.com/Legal-Copy7045/Magic-bHAnds/main/esphome/sounds/tap_in.wav
  sound_error: https://raw.githubusercontent.com/Legal-Copy7045/Magic-bHAnds/main/esphome/sounds/error.wav

packages:
  # MagicBand+ Bluetooth component, its actions/entities and Command entity.
  magicband: github://Legal-Copy7045/Magic-bHAnds/esphome/magicband-addon.yaml@main

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  # Each reader gets a unique name such as magicband-reader-3fa2c1.
  name_add_mac_suffix: true
  # Lets the MagicBand integration recognise this device as a reader.
  project:
    name: legal-copy7045.magicband-reader
    version: ${project_version}
  on_boot:
    priority: -100
    then:
      # Everything is set up now, so the ring's settings can be applied.
      - globals.set: {id: ring_ready, value: "true"}
      - script.execute: apply_ring_settings
      - script.execute: reader_idle
      - if:
          condition:
            switch.is_on: sound_enabled
          then:
            - media_player.speaker.play_on_device_media_file:
                media_file: snd_startup
                announcement: true

esp32:
  # ESP32-S3-DevKitC-1 N16R8 layout, e.g. Lonely Binary ESP32-S3 N16R8.
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# The N16R8 boards have 8 MB of PSRAM. Using it leaves room for Bluetooth and
# the HTTPS download that over-the-air updates need. Boards without PSRAM
# still start (it's skipped if not found).
psram:
  mode: octal
  speed: 80MHz

# Lets the ESPHome Device Builder offer "Take control" (adopt) for this device.
dashboard_import:
  package_import_url: github://Legal-Copy7045/Magic-bHAnds/esphome/magicband-reader.yaml@main
  import_full_config: false

logger:
  # Logs and the web installer's Wi-Fi setup use the port labelled "UART".
  hardware_uart: UART0
  # INFO, not the default DEBUG: at DEBUG every tag read (a band's NFC ID) is
  # printed, on the USB port of a reader that sits outside the door and in
  # Home Assistant's device logs. Warnings and errors (such as the PN532 not
  # answering) still show; band IDs never do.
  level: INFO

api:
  # Encrypted. Home Assistant gives each board its own key the first time it
  # connects, so there's no key to manage.
  encryption: {}
  # The idle glow turns amber while Home Assistant isn't connected.
  on_client_connected:
    - if:
        condition:
          and:
            - lambda: 'return id(ring_ready);'
            - not:
                script.is_running: band_tapped
        then:
          - script.execute: reader_idle
  on_client_disconnected:
    - if:
        condition:
          and:
            - lambda: 'return id(ring_ready);'
            - not:
                script.is_running: band_tapped
        then:
          - script.execute: reader_idle
  actions:
    # For "Ask Home Assistant" mode: an automation on the tag scan calls one
    # of these within 3 seconds (esphome.magicband_reader_<suffix>_accept / _deny).
    - action: accept
      then:
        - globals.set: {id: decision, value: "1"}
    - action: deny
      then:
        - globals.set: {id: decision, value: "2"}
    # Used by the MagicBand integration to replace the reader's allowed list.
    # bands: comma-separated band IDs (04-53-65-.. or 0453652A..: 4, 7 or 10
    # bytes of hex). A list that can't be applied in full (a malformed ID, or
    # too long to store) empties the allowed list instead of keeping the old
    # one, so a band revoked in Home Assistant can never stay allowed here.
    # The reply tells Home Assistant whether the list was applied.
    - action: set_known_bands
      variables:
        bands: string
      then:
        - lambda: |-
            std::string out = ",";
            std::string cur;
            std::string err;
            for (char c : std::string(bands) + ",") {
              if (c == ',') {
                if (!cur.empty()) {
                  if (cur.size() != 8 && cur.size() != 14 && cur.size() != 20) {
                    err = "A band ID in the list isn't 4, 7 or 10 bytes";
                    break;
                  }
                  out += cur + ",";
                }
                cur.clear();
              } else if (std::isxdigit(static_cast<unsigned char>(c))) {
                cur += static_cast<char>(std::toupper(static_cast<unsigned char>(c)));
              } else if (c != '-' && c != ':' && c != ' ') {
                err = "Unexpected character in the band list";
                break;
              }
            }
            if (err.empty() && out.size() >= id(known_list).size())
              err = "Too many bands: " + std::to_string(out.size()) + " characters, room for " +
                    std::to_string(id(known_list).size() - 1);
            std::fill(id(known_list).begin(), id(known_list).end(), 0);
            if (err.empty()) {
              std::copy(out.begin(), out.end(), id(known_list).begin());
              ESP_LOGI("reader", "Known bands updated: %u", (unsigned) std::count(out.begin(), out.end(), ',') - 1);
            } else {
              ESP_LOGE("reader", "%s. Known bands cleared: every band is denied until a valid list arrives",
                       err.c_str());
            }
            id(sync_error) = err;
        - component.update: known_band_count
        - api.respond:
            success: !lambda 'return id(sync_error).empty();'
            error_message: !lambda 'return id(sync_error);'
    # Used by the MagicBand integration: each allowed band's owner's welcome
    # colour, as "UID=Colour,UID=Colour" (colours as in "Welcome colour").
    # Bands not listed are welcomed in "Welcome colour".
    - action: set_band_colours
      variables:
        colours: string
      then:
        - lambda: |-
            static const char *const NAMES[] = {"White", "Warm white", "Red", "Orange", "Yellow", "Green", "Cyan", "Blue", "Purple", "Pink", "Magenta"};
            std::string out = ",";
            std::string err;
            std::string all = std::string(colours);
            size_t start = 0;
            while (err.empty() && start < all.size()) {
              size_t end = all.find(',', start);
              if (end == std::string::npos) end = all.size();
              std::string token = all.substr(start, end - start);
              start = end + 1;
              if (token.empty()) continue;
              size_t eq = token.find('=');
              if (eq == std::string::npos) { err = "Expected UID=Colour"; break; }
              std::string key;
              for (char c : token.substr(0, eq)) {
                if (std::isxdigit(static_cast<unsigned char>(c)))
                  key += static_cast<char>(std::toupper(static_cast<unsigned char>(c)));
                else if (c != '-' && c != ':' && c != ' ') { err = "Unexpected character in a band ID"; break; }
              }
              if (!err.empty()) break;
              std::string name = token.substr(eq + 1);
              bool known = false;
              for (const char *n : NAMES) known = known || name == n;
              if ((key.size() != 8 && key.size() != 14 && key.size() != 20) || !known) {
                err = "A band ID or colour isn't valid";
                break;
              }
              out += key + "=" + name + ",";
            }
            if (err.empty() && out.size() >= id(band_colours).size()) err = "Too many welcome colours";
            std::fill(id(band_colours).begin(), id(band_colours).end(), 0);
            if (err.empty()) {
              std::copy(out.begin(), out.end(), id(band_colours).begin());
              ESP_LOGI("reader", "Welcome colours updated");
            } else {
              ESP_LOGW("reader", "%s. Every band is welcomed in the Welcome colour", err.c_str());
            }
            id(sync_error) = err;
        - api.respond:
            success: !lambda 'return id(sync_error).empty();'
            error_message: !lambda 'return id(sync_error);'

ota:
  # Updates come from the published firmware through Home Assistant (the
  # Firmware update entity), over the encrypted connection. "Take control" in
  # the ESPHome Device Builder adds its own password-protected upload method.
  - platform: http_request

http_request:

update:
  - platform: http_request
    name: Firmware
    source: ${firmware_manifest}
    update_interval: 6h

wifi:
  # No credentials here: they're entered in the web installer (Improv over
  # USB). There's deliberately no fallback hotspot: ESPHome's captive portal
  # accepts a firmware upload from anyone who joins it, and an open hotspot
  # can be forced on by knocking the board off Wi-Fi for 90 seconds. To change
  # Wi-Fi later, plug the board into a computer and use the web installer.
  # (Building your own? You can add "ap:" with a strong password and
  # "captive_portal:" back.)

improv_serial:

# Feedback to MagicBand+ is meant for the band on the reader, so keep the
# Bluetooth power low (the add-on defaults to max for whole-room bridges).
# Every band in range reacts to a broadcast (it can't be addressed to one),
# so the "Band light-up power" setting below sets how far it reaches.
magicband:
  tx_power: -12dBm

# ---------------------------------------------------------------------------
# NFC reader: PN532 on I2C (set the module's switches to I2C mode)
# ---------------------------------------------------------------------------
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

pn532_i2c:
  id: nfc_reader
  update_interval: 250ms
  on_tag:
    then:
      - script.execute:
          id: band_tapped
          uid: !lambda 'return x;'

# ---------------------------------------------------------------------------
# LEDs: one WS2812B ring (data via the 74AHCT125 level shifter)
# ---------------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    id: ring
    name: "Ring"
    pin: GPIO10   # LED data (via the 74AHCT125); on the Lonely Binary terminal base too
    chipset: WS2812
    # Sized for the largest ring; apply_ring_settings sets the real count,
    # colour order and power cap from the settings at boot.
    # Four bytes per LED, so the buffer also fits RGBW rings; apply_ring_settings
    # switches to three for RGB rings ("Ring type").
    channel_colors: ${ring_color_order}W
    num_leds: ${ring_max_leds}
    default_transition_length: 300ms
    restore_mode: ALWAYS_OFF
    effects:
      # Home Assistant not connected: a slow amber breathing (see reader_idle).
      - pulse:
          name: "Offline"
          transition_length: 1.5s
          update_interval: 1.5s
          min_brightness: 15%
          max_brightness: 100%
      # The idle glow in "Warm white". Dimmed the normal way, each colour
      # channel keeps at least one step, so a dim warm white (lots of red,
      # some green, a little blue) turned into one step of each: a cool white.
      # Here the mix is set in the ring's own output steps, after its
      # brightness curve, so it stays warm at any "Idle glow". The light runs
      # at 100 % while this effect is on; the effect does the dimming.
      - addressable_lambda:
          name: "Warm glow"
          update_interval: 1s
          lambda: |-
            if (it.size() == 0) return;
            const float pct = id(night) ? id(idle_glow_night).state : id(idle_glow).state;
            const float p = std::isnan(pct) ? 0.3f : std::max(0.0f, std::min(100.0f, pct)) / 100.0f;
            // The output steps one channel gives for value v (brightness curve, power cap, LED brightness).
            auto out = [&](uint8_t v, int ch) -> int {
              it[0] = Color(ch == 0 ? v : 0, ch == 1 ? v : 0, ch == 2 ? v : 0);
              return ch == 0 ? it[0].get_red_raw() : ch == 1 ? it[0].get_green_raw() : it[0].get_blue_raw();
            };
            // The smallest value giving at least `target` steps (0 = off).
            auto value_for = [&](int target, int ch) -> uint8_t {
              if (target <= 0) return 0;
              int lo = 1, hi = 255;
              while (lo < hi) { int mid = (lo + hi) / 2; if (out(mid, ch) >= target) hi = mid; else lo = mid + 1; }
              return lo;
            };
            // Red as bright as the other colours' brightest channel at this setting,
            // at least 5 steps so green can keep its share (2 of 5).
            int red = p > 0 ? out(static_cast<uint8_t>(lroundf(255.0f * p)), 0) : 0;
            if (red > 0) red = std::min(std::max(red, 5), out(255, 0));
            // The same mix as "Warm white" at full brightness: green 37 %, blue 5 % of red.
            const int green = lroundf(red * 0.37f), blue = lroundf(red * 0.053f);
            it.all() = Color(value_for(red, 0), value_for(green, 1), value_for(blue, 2));
      # Band presented: a head with a fading tail chasing round the ring, one
      # circle per "Circle time" whatever the LED count.
      - addressable_lambda:
          name: "Chase"
          update_interval: 16ms
          lambda: |-
            static uint32_t start = 0;
            if (initial_run) start = millis();
            const int n = it.size();
            const float ct = id(circle_time).state;
            const uint32_t circle_ms = std::isnan(ct) || ct < 0.1f ? 500 : static_cast<uint32_t>(ct * 1000.0f);
            const int head = static_cast<int>(((millis() - start) % circle_ms) * n / circle_ms);
            // "Circle tail": the trail's length in LEDs; 0 = a fifth of the ring (at least 3)
            const float ts = id(circle_tail).state;
            int tail = std::isnan(ts) || ts < 1 ? (n / 5 > 3 ? n / 5 : 3) : static_cast<int>(ts);
            if (tail > n) tail = n;
            it.all() = Color::BLACK;
            for (int t = 0; t < tail; t++) {
              int i = ((head - t) % n + n) % n;
              it[i] = current_color * static_cast<uint8_t>(255 - t * (230 / tail));
            }
      # Denied: fades up and down `pulse_count` times ("Pulse time" each, a
      # third of that apart), then stays dark.
      - addressable_lambda:
          name: "Pulse"
          update_interval: 16ms
          lambda: |-
            static uint32_t start = 0;
            if (initial_run) start = millis();
            const float pt = id(pulse_time).state;
            const uint32_t on_ms = std::isnan(pt) || pt < 0.1f ? 450 : static_cast<uint32_t>(pt * 1000.0f);
            const uint32_t gap_ms = on_ms / 3, t = millis() - start;
            const uint32_t k = t / (on_ms + gap_ms), p = t % (on_ms + gap_ms);
            float level = 0.0f;
            if (k < static_cast<uint32_t>(id(pulse_count)) && p < on_ms)
              level = sinf(3.14159265f * p / on_ms);
            it.all() = current_color * static_cast<uint8_t>(level * 255.0f);
      # Welcome: up in "Welcome fade in", on for "Welcome hold", down in
      # "Welcome fade out"; `pulse_count` times ("Welcome pulses"), 0.2 s apart.
      - addressable_lambda:
          name: "Welcome"
          update_interval: 16ms
          lambda: |-
            static uint32_t start = 0;
            if (initial_run) start = millis();
            auto ms = [](float s, float d) { return static_cast<uint32_t>((std::isnan(s) || s < 0 ? d : s) * 1000.0f); };
            const uint32_t in = ms(id(welcome_fade_in).state, 0.15f), hold = ms(id(welcome_hold).state, 1.0f),
                           out = ms(id(welcome_fade_out).state, 1.0f);
            const uint32_t cycle = in + hold + out + 200, t = millis() - start, k = t / cycle, p = t % cycle;
            float level = 0.0f;
            if (k < static_cast<uint32_t>(id(pulse_count))) {
              if (p < in) level = static_cast<float>(p) / in;
              else if (p < in + hold) level = 1.0f;
              else if (p < in + hold + out) level = 1.0f - static_cast<float>(p - in - hold) / out;
            }
            it.all() = current_color * static_cast<uint8_t>(level * 255.0f);
      - addressable_lambda:
          name: "Spin"
          update_interval: 25ms
          lambda: |-
            static int pos = 0;
            if (initial_run) pos = 0;
            const int n = it.size();
            it.all() = Color::BLACK;
            for (int t = 0; t < 8; t++) {
              int i = ((pos - t) % n + n) % n;
              it[i] = current_color * static_cast<uint8_t>(255 - t * 30);
            }
            pos = (pos + 1) % n;
      - addressable_lambda:
          name: "Breathe"
          update_interval: 30ms
          lambda: |-
            static uint16_t phase = 0;
            phase = (phase + 3) % 512;
            uint8_t level = phase < 256 ? phase : 511 - phase;
            it.all() = current_color * static_cast<uint8_t>(20 + level / 2);

# ---------------------------------------------------------------------------
# Sound: MAX98357A I2S amplifier + small speaker, playing your own sound files
# ---------------------------------------------------------------------------
# The sound files (see substitutions) are embedded in the firmware at build
# time, so they play instantly with no network involved. Mono 16-bit
# WAV/FLAC/MP3 under 5 MB each; see docs/reader.md.
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO5   # MAX98357A LRC
    i2s_bclk_pin: GPIO6    # MAX98357A BCLK

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO7
    dac_type: external
    channel: mono

media_player:
  # Also usable from Home Assistant (announcements, TTS).
  - platform: speaker
    id: reader_speaker
    name: "Speaker"
    volume_initial: 70%
    announcement_pipeline:
      speaker: spk
      num_channels: 1
    files:
      - id: snd_startup
        file: ${sound_startup}
      - id: snd_tap_in
        file: ${sound_tap_in}
      - id: snd_error
        file: ${sound_error}

# ---------------------------------------------------------------------------
# Behaviour
# ---------------------------------------------------------------------------
globals:
  # False until boot has finished. The LED settings restore their values during
  # set-up, before the ring's driver is ready; touching the ring then crashes.
  - id: ring_ready
    type: bool
    initial_value: "false"
  - id: pulse_count       # how many times the "Pulse" effect fades up and down
    type: int
    initial_value: "1"
  - id: rgb               # the colour chosen by set_ring_colour: r, g, b, white (0-1)
    type: std::array<float, 4>
    initial_value: "{1.0f, 1.0f, 1.0f, 0.0f}"
  - id: decision          # 0 = waiting, 1 = accept, 2 = deny
    type: int
    initial_value: "0"
  # Allowed bands for "Known bands only": ",UID,UID," with IDs uppercase and
  # without separators. Stored on the reader, so it survives restarts and
  # works with Home Assistant offline. Room for 213 bands with 7-byte IDs
  # (READER_LIST_CAPACITY in the integration must match: size - 1).
  - id: known_list
    type: std::array<char, 3200>
    restore_value: true
    update_interval: 5s
  - id: sync_error        # why the last set_known_bands failed ("" = applied)
    type: std::string
  # Each allowed band's owner's welcome colour: ",UID=Colour,UID=Colour,"
  # (from the MagicBand integration's set_band_colours).
  - id: band_colours
    type: std::array<char, 4096>
    restore_value: true
  - id: welcome_name      # the colour this tap is welcomed in
    type: std::string
  - id: night             # inside the night hours (see update_night)
    type: bool
    initial_value: "false"
  # Today's sunset and sunrise, minutes after local midnight, from Home
  # Assistant's sun (sun.sun). Kept through restarts, so "Sunset to sunrise"
  # keeps working while Home Assistant is away; -1 = not known yet.
  - id: sunset_min
    type: int
    restore_value: true
    initial_value: "-1"
  - id: sunrise_min
    type: int
    restore_value: true
    initial_value: "-1"

select:
  # When "Idle glow at night" applies: between "Night from" and "Night until",
  # or from sunset to sunrise (each moved by its offset in minutes). The sun
  # times come from Home Assistant's sun; until it has sent them, the set
  # hours are used.
  - platform: template
    id: night_mode
    name: "Night mode"
    icon: mdi:weather-night
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Set hours"
    options:
      - "Set hours"
      - "Sunset to sunrise"
    on_value:
      - script.execute: update_night
  # How far the welcome's light-up reaches. Every MagicBand+ in range reacts,
  # so lower it until only the band on the reader lights up. Each -6 dB
  # roughly halves the reach; -24 dBm is about arm's length or less.
  - platform: template
    id: band_power
    name: "Band light-up power"
    icon: mdi:signal-distance-variant
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "-12 dBm"
    options:
      - "-24 dBm"
      - "-21 dBm"
      - "-18 dBm"
      - "-15 dBm"
      - "-12 dBm"
      - "-9 dBm"
      - "-6 dBm"
      - "-3 dBm"
      - "0 dBm"
    on_value:
      - lambda: |-
          int dbm = atoi(x.c_str());
          if (dbm < -24 || dbm > 0) dbm = -12;
          // ESP32-S3 power levels: index 0 = -24 dBm, in 3 dB steps.
          id(band).set_tx_power(static_cast<esp_power_level_t>((dbm + 24) / 3), dbm);
          ESP_LOGI("reader", "Band light-up power: %d dBm", dbm);
  # The ring's tap sequence: checking colour, then the welcome or denied
  # colour (see the "Chase" and "Pulse" effects and the number settings).
  - platform: template
    id: checking_colour
    name: "Checking colour"
    icon: mdi:palette-outline
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "White"
    options:
      - "White"
      - "Warm white"
      - "Red"
      - "Orange"
      - "Yellow"
      - "Green"
      - "Cyan"
      - "Blue"
      - "Purple"
      - "Pink"
      - "Magenta"
  - platform: template
    id: idle_colour
    name: "Idle colour"
    icon: mdi:palette-outline
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "White"
    options:
      - "White"
      - "Warm white"
      - "Red"
      - "Orange"
      - "Yellow"
      - "Green"
      - "Cyan"
      - "Blue"
      - "Purple"
      - "Pink"
      - "Magenta"
    on_value:
      # Not before boot has finished (restoring the setting at start-up runs
      # this too, and the ring isn't set up yet: see ring_ready), nor during a tap.
      - if:
          condition:
            and:
              - lambda: 'return id(ring_ready);'
              - not:
                  script.is_running: band_tapped
          then:
            - script.execute: reader_idle
  - platform: template
    id: welcome_colour
    name: "Welcome colour"
    icon: mdi:palette
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Green"
    options:
      - "White"
      - "Warm white"
      - "Red"
      - "Orange"
      - "Yellow"
      - "Green"
      - "Cyan"
      - "Blue"
      - "Purple"
      - "Pink"
      - "Magenta"
  - platform: template
    id: denied_colour
    name: "Denied colour"
    icon: mdi:palette-swatch
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Red"
    options:
      - "White"
      - "Warm white"
      - "Red"
      - "Orange"
      - "Yellow"
      - "Green"
      - "Cyan"
      - "Blue"
      - "Purple"
      - "Pink"
      - "Magenta"
  - platform: template
    id: response_mode
    name: "Response mode"
    icon: mdi:account-check
    entity_category: config
    optimistic: true
    restore_value: true
    # Default: only bands on the reader's list are welcomed. A new band's first
    # scan gets the denied sequence; allow it with "Allow last band".
    initial_option: "Known bands only"
    options:
      - "Known bands only"
      - "Welcome every band"
      - "Ask Home Assistant"
  # What the ring's LEDs are. RGBW rings (SK6812 RGBW) have a white LED in
  # each pixel, warm, neutral or cool; White and Warm white use it. Changing
  # this restarts the reader, so Home Assistant sees the Ring light's new
  # colour modes.
  - platform: template
    id: ring_type
    name: "Ring type"
    icon: mdi:led-on
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: ${ring_type}
    options:
      - "RGB"
      - "RGBW warm white"
      - "RGBW neutral white"
      - "RGBW cool white"
    on_value:
      - if:
          condition:
            lambda: 'return id(ring_ready);'
          then:
            - logger.log:
                format: "Ring type is now %s: restarting"
                args: ['x.c_str()']
                level: INFO
            - delay: 1s
            - lambda: 'App.safe_reboot();'
  - platform: template
    id: ring_order
    name: "LED colour order"
    icon: mdi:palette
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: ${ring_color_order}
    options:
      - "GRB"
      - "RGB"
    on_value:
      - if:
          condition:
            lambda: 'return id(ring_ready);'
          then:
            - script.execute: apply_ring_settings
            - script.execute: reader_idle

number:
  # The ring's tap sequence timing.
  - platform: template
    id: checking_circles
    name: "Checking circles"
    icon: mdi:rotate-right
    entity_category: config
    optimistic: true
