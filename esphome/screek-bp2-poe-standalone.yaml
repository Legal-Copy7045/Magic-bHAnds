# SCREEK BP2-POE (ESP32-S3 + W5500 Ethernet) as a Bluetooth proxy + MagicBand
# bridge. Rebuilt from the factory firmware's boot log (SCREEK.Bluetooth_Proxy
# BP2-POE 26.01.23-A), keeping its Scan Interval / Scan Window controls
# (Home Assistant sets active or passive scanning), plus the shared MagicBand add-on.
#
# Install: the web installer (https://legal-copy7045.github.io/Magic-bHAnds/)
# over USB-C, or the ESPHome Device Builder. No secrets needed. Later updates
# come from GitHub through Home Assistant's Firmware update entity.
# To go back to factory firmware, use SCREEK's web installer or a backup.
#
# This is the single-file version for pasting into the Device Builder; it must
# stay identical to screek-bp2-poe.yaml + magicband-addon.yaml (CI checks).

substitutions:
  # The clocks' zone until the "Time zone" setting is applied (IANA name).
  timezone: America/New_York
  name: screek-bp2-poe-849a4c
  friendly_name: SCREEK BP2-POE 849a4c
  project_version: "0.10.32"
  firmware_manifest: https://legal-copy7045.github.io/Magic-bHAnds/bp2/manifest.json

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  project:
    name: legal-copy7045.magicband-bp2-poe
    version: ${project_version}
  name_add_mac_suffix: false

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# 8 MB PSRAM: room for Bluetooth and the HTTPS download of firmware updates.
psram:
  mode: octal
  speed: 80MHz

external_components:
  - source: github://Legal-Copy7045/Magic-bHAnds@main
    components: [magicband]
    refresh: 0s   # always use the latest component (avoids stale-cache build errors)

logger:
  hardware_uart: USB_SERIAL_JTAG   # logs over the USB-C port

api:
  # Encrypted. Home Assistant gives the board its own key the first time it
  # connects, so there's no key to manage.
  encryption: {}
  # Per-board actions appear as esphome.screek_bp2_poe_849a4c_<action>.
  actions:
    # Whole band one colour.
    - action: color
      variables:
        color: string
        vibration: int
      then:
        - lambda: |-
            id(band).send_single_color(
                magicband::MagicBand::color_from_string(color), vibration);

    # One colour with full control: which LEDs, how long, fade, always on.
    - action: color_advanced
      variables:
        color: string
        vibration: int
        leds: string          # all, top_left, top_right, bottom_left, bottom_right
        on_seconds: float     # ~5.5-52 (0 = default)
        fade_seconds: int     # 0-3
        always_on: bool       # stay lit until another command / off
      then:
        - lambda: |-
            id(band).send_single_color(
                magicband::MagicBand::color_from_string(color), vibration,
                magicband::MagicBand::timing_or(magicband::TIMING_SINGLE_DEFAULT,
                                                on_seconds, fade_seconds, always_on),
                magicband::MagicBand::leds_from_string(leds));

    # Any colour: 0-255 per channel.
    - action: rgb
      variables:
        red: int
        green: int
        blue: int
        vibration: int
        always_on: bool
        flash: bool
      then:
        - lambda: |-
            id(band).send_rgb(red, green, blue, vibration,
                always_on ? magicband::TIMING_ALWAYS_ON : magicband::TIMING_SINGLE_DEFAULT,
                flash);

    # Centre (inner) and outer ring colours.
    - action: dual_color
      variables:
        inner: string
        outer: string
        vibration: int
      then:
        - lambda: |-
            id(band).send_dual_color(
                magicband::MagicBand::color_from_string(inner),
                magicband::MagicBand::color_from_string(outer), vibration);

    # "centre, top right, bottom right, bottom left, top left"
    - action: five_color
      variables:
        colors: string
        vibration: int
      then:
        - lambda: id(band).send_five_color(colors, vibration);

    - action: crossfade
      variables:
        color1: string
        color2: string
        vibration: int
      then:
        - lambda: |-
            id(band).send_crossfade(
                magicband::MagicBand::color_from_string(color1),
                magicband::MagicBand::color_from_string(color2), vibration);

    - action: circle
      variables:
        vibration: int
      then:
        - lambda: id(band).send_circle(vibration);

    # Predefined scene by name or label, e.g. rainbow, crossfade_3, "Spin & buzz 2".
    # Full list: docs/commands.md#scenes
    - action: animation
      variables:
        name: string
      then:
        - lambda: id(band).send_animation(name);

    - action: ping
      variables:
        fast: bool
      then:
        - lambda: id(band).send_ping(fast);

    # Fast-mode ping on its own for a while, so bands react quickly afterwards.
    - action: wake
      variables:
        seconds: float
      then:
        - lambda: 'id(band).wake_bands(seconds > 0 ? seconds : 15.0f);'

    - action: "off"
      then:
        - lambda: id(band).send_off();

    # Experimentation: any payload as hex (leading "83 01" optional), and a
    # custom broadcast duration in ms (0 = default).
    - action: raw
      variables:
        hex: string
        duration_ms: int
      then:
        - lambda: id(band).send_hex(hex, duration_ms);

    - action: stop
      then:
        - lambda: id(band).stop();

ota:
  # Updates come from the published firmware through Home Assistant (the
  # Firmware update entity), over the encrypted connection.
  - platform: http_request

http_request:

update:
  - platform: http_request
    id: firmware_update
    name: Firmware
    source: ${firmware_manifest}
    update_interval: 6h

# Lets the ESPHome Device Builder offer "Take control" (adopt) for this device.
dashboard_import:
  package_import_url: github://Legal-Copy7045/Magic-bHAnds/esphome/screek-bp2-poe.yaml@main
  import_full_config: false

# Safe mode after a real boot loop: 20 starts in a row that each fail within
# 30 seconds. Higher than ESPHome's defaults (10 within a minute) so a run of
# restarts from Home Assistant ("Reboot Device", which any user can press) or
# of PoE power cycles can't put the proxy in safe mode, where it has no API
# and no Bluetooth proxy. A press of Reboot Device restarts cleanly, which
# also resets the count; a crash early in every start still trips it.
safe_mode:
  num_attempts: 20
  boot_is_good_after: 30s

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9
  clock_speed: 25MHz

# Bluetooth proxy: on by default, as on the factory firmware, with the same
# "Bluetooth proxy" switch as the MagicBand Bridge to turn it off.
# Scan Interval / Scan Window below adjust it at runtime; Home Assistant
# chooses active or passive scanning (ESPHome integration options).
esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true
    continuous: false   # started by the "Bluetooth proxy" switch (on by default)

bluetooth_proxy:
  active: true
  connection_slots: 4

esp32_ble:
  id: ble
  max_connections: 4

magicband:
  id: band
  duration: 2s        # how long each command is broadcast
  tx_power: max       # +20 dBm on ESP32-S3/C3, +9 dBm on the original ESP32
  pause_scanning: true  # pause Bluetooth-proxy scanning while broadcasting

time:
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}
    on_time_sync:
      - script.execute: apply_time_zone
  # Internet time, so the device keeps local time (and its automatic-update
  # window) without Home Assistant. Both clocks use the "Time zone" setting.
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    on_time_sync:
      - script.execute: apply_time_zone
    on_time:
      # Automatic updates: look for a new release at 02:55, then install it
      # between 03:00 and 04:00 local time, by the internet clock so it doesn't
      # need Home Assistant (tried every 10 minutes, so a failed
      # download gets another go). Only signed releases install (see
      # docs/security.md, "Signed updates"), and only a newer one: the job
      # never goes back to an older signed release. Installing from Home
      # Assistant's Firmware entity is up to you.
      - seconds: 0
        minutes: 55
        hours: 2
        then:
          - if:
              condition:
                switch.is_on: auto_update
              then:
                - component.update: firmware_update
      - seconds: 0
        minutes: /10
        hours: 3
        then:
          - if:
              condition:
                and:
                  - switch.is_on: auto_update
                  - update.is_available: firmware_update
                  - lambda: |-
                      const auto &info = id(firmware_update).update_info;
                      if (magicband::release_newer(info.latest_version, info.current_version)) return true;
                      ESP_LOGW("update", "Automatic update: %s is not newer than %s, not installing",
                               info.latest_version.c_str(), info.current_version.c_str());
                      return false;
              then:
                - logger.log:
                    format: "Automatic update: installing the new release"
                    level: INFO
                - update.perform: firmware_update

debug:
  update_interval: 60s

# --- Scan tuning (same entities as the factory firmware) ---------------------
# Changes restart scanning briefly to apply; values survive reboots.
script:
  # Applies the "Time zone" setting to the device's clocks.
  - id: apply_time_zone
    then:
      - lambda: |-
          if (!magicband::set_time_zone(id(time_zone).current_option()))
            ESP_LOGW("time", "Unknown time zone: %s", id(time_zone).current_option().c_str());
  - id: apply_scan_settings
    mode: restart
    then:
      - lambda: |-
          float interval = id(scan_interval).state;
          float window = std::min(id(scan_window).state, interval);
          id(ble_tracker).set_scan_interval(static_cast<uint32_t>(interval / 0.625f));
          id(ble_tracker).set_scan_window(static_cast<uint32_t>(window / 0.625f));
          // Active or passive scanning is Home Assistant's choice: ESPHome
          // integration -> this device -> Configure -> Bluetooth scanning mode.
          ESP_LOGI("scan", "Apply BLE scan: interval=%.0fms window=%.0fms", interval, window);
      # Restart scanning to apply, unless the proxy is switched off.
      - if:
          condition:
            switch.is_on: proxy_switch
          then:
            - esp32_ble_tracker.stop_scan:
            - delay: 500ms
            - esp32_ble_tracker.start_scan:
                continuous: true

number:
  # Fast mode warm-up: after 30 s of quiet, send the fast ping on its own for
  # this long before the next effect. Makes the first effect more reliable but
  # delays it by this much. 0 = off.
  - platform: template
    id: fast_warmup
    name: "Fast mode warm-up"
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: s
    min_value: 0
    max_value: 15
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
    on_value:
      - lambda: id(band).set_fast_warmup(static_cast<uint32_t>(x * 1000));
  - platform: template
    id: scan_interval
    name: "Scan Interval"
    icon: mdi:bluetooth-settings
    unit_of_measurement: ms
    entity_category: config
    mode: box
    min_value: 20
    max_value: 10240
    step: 10
    initial_value: 1100
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: apply_scan_settings
  - platform: template
    id: scan_window
    name: "Scan Window"
    icon: mdi:bluetooth-settings
    unit_of_measurement: ms
    entity_category: config
    mode: box
    min_value: 20
    max_value: 10240
    step: 10
    initial_value: 1100
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: apply_scan_settings

switch:
  # Installs new releases by itself between 03:00 and 04:00 (local time in the
  # "Time zone" setting, by the internet clock), without Home Assistant.
  - platform: template
    id: auto_update
    name: "Automatic updates"
    icon: mdi:update
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  # Same as the MagicBand Bridge's: turns the Bluetooth proxy (scanning) on
  # or off. On by default here, as on the factory firmware.
  - platform: template
    id: proxy_switch
    name: "Bluetooth proxy"
    icon: mdi:bluetooth-connect
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - esp32_ble_tracker.start_scan:
          continuous: true
    turn_off_action:
      - esp32_ble_tracker.stop_scan:
  # Mixes the "fast mode" ping (CC 03 00 01 00) into every broadcast. It's
  # believed to switch bands from slow, occasional listening to continuous
  # listening, so effects start sooner and back-to-back commands land.
  - platform: template
    id: fast_mode
    name: "Fast mode"
    icon: mdi:run-fast
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(band).set_fast_mode(true);
    turn_off_action:
      - lambda: id(band).set_fast_mode(false);
light:
  - platform: esp32_rmt_led_strip
    id: identify_led
    name: "Identify LED"
    pin: GPIO21
    chipset: WS2812
    channel_colors: GRB
    num_leds: 1
    default_transition_length: 1s
    entity_category: config
  # Pick any colour in Home Assistant; nearby bands glow it until turned off.
  # Effects play captured park animations.
  - platform: magicband
    id: band_light
    name: "MagicBand"
    icon: mdi:watch-variant
    restore_mode: RESTORE_DEFAULT_ON   # on by default, then remembers on/off and colour
    default_transition_length: 0s
    effects:
      - lambda:
          name: "Rainbow (5 colour)"
          update_interval: 1h
          lambda: |-
            if (initial_run)
              id(band).send_five_color("red, orange, yellow, green, blue", 0, magicband::TIMING_ALWAYS_ON);
      - lambda:
          name: "Colour cycle"
          update_interval: 1h
          lambda: 'if (initial_run) id(band).send_animation("color_cycle");'
      - lambda:
          name: "Rainbow animation"
          update_interval: 1h
          lambda: 'if (initial_run) id(band).send_animation("rainbow");'
      - lambda:
          name: "Lightning"
          update_interval: 1h
          lambda: 'if (initial_run) id(band).send_animation("lightning");'
      - lambda:
          name: "Orange blink"
          update_interval: 1h
          lambda: 'if (initial_run) id(band).send_animation("orange_blink");'
      - lambda:
          name: "Circle"
          update_interval: 1h
          lambda: 'if (initial_run) id(band).send_animation("circle");'
      - lambda:
          name: "Crossfade"
          update_interval: 1h
          lambda: 'if (initial_run) id(band).send_animation("crossfade");'

text:
  # Send a JSON command, e.g. {"effect":"color","color":"red","vibration":3}.
  # Lets Home Assistant target one, several or all bridges with text.set_value.
  # Fields: docs/commands.md
  - platform: template
    id: command
    name: "Command"
    icon: mdi:console-line
    entity_category: config
    mode: text
    max_length: 255
    optimistic: false
    set_action:
      - lambda: id(band).run_command_json(x);

select:
  # The local time zone for every clock on the device (automatic updates, and
  # on the reader night mode). Applied at once and kept across restarts.
  - platform: template
    id: time_zone
    name: "Time zone"
    icon: mdi:map-clock
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Eastern (New York)"
    options:   # keep in step with components/magicband/time_zone.h
      - "Eastern (New York)"
      - "Central (Chicago)"
      - "Mountain (Denver)"
      - "Arizona (Phoenix)"
      - "Pacific (Los Angeles)"
      - "Alaska (Anchorage)"
      - "Hawaii (Honolulu)"
      - "UK (London)"
      - "Central Europe (Paris)"
      - "UTC"
    on_value:
      - script.execute: apply_time_zone
  # Plays a predefined scene when chosen (use "Play scene" to repeat it).
  - platform: template
    id: scene
    name: "Scene"
    icon: mdi:movie-open-play
    optimistic: true
    restore_value: true
    initial_option: "Rainbow"
    options:
      - "Lightning"
      - "Orange blink"
      - "Color cycle"
      - "Rainbow"
      - "Circle"
      - "Alternating"
      - "Crossfade"
      - "Crossfade 2"
      - "Crossfade 3"
      - "Crossfade 4"
      - "Crossfade 5"
      - "Crossfade 6"
      - "Crossfade 7"
      - "Spin & buzz"
      - "Spin & buzz 2"
      - "Spin & buzz 3"
      - "Show 0E 1"
      - "Show 0E 2"
      - "Show 0E 3"
      - "Show 0E 4"
      - "Show 0E 5"
      - "Show 0F 1"
      - "Show 0F 2"
      - "Show 13 1"
      - "Show 13 2"
      - "Show 13 3"
      - "Show 14 1"
      - "Show 14 2"
      - "Show 14 3"
      - "Show 07 1"
      - "Show 07 2"
    set_action:
      - lambda: id(band).send_animation(x);
  # E1 00 / E2 00 prefix (seen in park captures):
  #   Alternate - flip it on each new command (default; makes repeats more reliable)
  #   Both      - experimental: also flip it every 100 ms within each burst
  #   Off       - no prefix
  - platform: template
    id: prefix_mode
    name: "Prefix mode"
    icon: mdi:swap-horizontal
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Alternate"
    options:
      - "Alternate"
      - "Both (experimental)"
      - "Off"
    on_value:
      - lambda: id(band).set_prefix_mode_by_name(x);
  # Used by the Buzz button. Patterns: '=0.125s  -=0.25s  *=0.5s  %=1s  #=2s
  - platform: template
    id: vibration_pattern
    name: "Vibration pattern"
    icon: mdi:vibrate
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "3: ---"
    options:
      - "1: -"
      - "2: --"
      - "3: ---"
      - "4: --*"
      - "5: ----*-"
      - "6: ---***---"
      - "7: # (2s)"
      - "8: flutter"
      - "9: - (alt)"
      - "10: * (0.5s)"
      - "11: % (1s)"

sensor:
  - platform: internal_temperature
    name: "CPU Temperature"
    entity_category: diagnostic
  - platform: debug
    free:
      name: "Heap Free"
      entity_category: diagnostic

text_sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: ethernet_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic
  - platform: debug
    reset_reason:
      name: "Reboot Reason"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Reboot Device"
    entity_category: diagnostic
  # No "Factory Reset" button: any Home Assistant user could press it, and a
  # reset board accepts the first client that brings a new encryption key.
  # No "Safe Mode Boot" button either: any user could press it, and with only
  # signed network updates (no upload port) safe mode just leaves the board
  # without its API and Bluetooth proxy until it times out. Safe mode itself
  # still starts by itself after repeated failed boots.
  - platform: template
    name: "Buzz"
    icon: mdi:vibrate
    on_press:
      - lambda: |-
          id(band).send_single_color(magicband::OFF,
              id(vibration_pattern).active_index().value_or(2) + 1);
  - platform: template
    name: "Test red buzz"
    icon: mdi:watch-vibrate
    on_press:
      - lambda: id(band).send_single_color(magicband::RED, 3);
  - platform: template
    name: "Test rainbow"
    icon: mdi:looks
    on_press:
      - lambda: id(band).send_five_color("red, orange, yellow, green, blue", 0);
  - platform: template
    name: "Ping"
    icon: mdi:access-point
    on_press:
      - lambda: id(band).send_ping(true);
  - platform: template
    name: "Wake bands"
    icon: mdi:alarm
    on_press:
      - lambda: id(band).wake_bands(15);
  - platform: template
    name: "Play scene"
    icon: mdi:play
    on_press:
      - lambda: id(band).send_animation(id(scene).current_option());
  # One-press scenes
  - platform: template
    name: "Scene: Rainbow"
    icon: mdi:looks
    on_press:
      - lambda: id(band).send_animation("rainbow");
  - platform: template
    name: "Scene: Lightning"
    icon: mdi:flash
    on_press:
      - lambda: id(band).send_animation("lightning");
  - platform: template
    name: "Scene: Colour cycle"
    icon: mdi:palette
    on_press:
      - lambda: id(band).send_animation("color_cycle");
  - platform: template
    name: "Scene: Crossfade"
    icon: mdi:gradient-horizontal
    on_press:
      - lambda: id(band).send_animation("crossfade");
  - platform: template
    name: "Scene: Spin & buzz"
    icon: mdi:rotate-right
    on_press:
      - lambda: id(band).send_animation("spin_buzz");
  - platform: template
    name: "Scene: Alternating"
    icon: mdi:swap-horizontal-variant
    on_press:
      - lambda: id(band).send_animation("alternating");
