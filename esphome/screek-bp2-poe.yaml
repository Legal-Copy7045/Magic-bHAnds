# SCREEK BP2-POE (ESP32-S3 + W5500 Ethernet) as a Bluetooth proxy + MagicBand
# bridge.
#
# Rebuilt from the factory firmware's boot log (SCREEK.Bluetooth_Proxy BP2-POE
# 26.01.23-A). SCREEK hasn't published their YAML, so their custom scan-tuning
# entities (Scan Interval / Scan Window numbers, Scan Active Mode switch) are
# replaced by fixed scan settings below. To go back to factory firmware, use
# SCREEK's web installer or your esptool backup.
#
# First install must be over USB (factory firmware has an OTA password).
# Secrets needed in the ESPHome Device Builder's secrets.yaml:
#   bp2_api_key: 32-byte base64 key, e.g. from
#     python -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(32)).decode())"
# (used for both the Home Assistant connection and network updates)

substitutions:
  name: screek-bp2-poe
  friendly_name: SCREEK BP2-POE

packages:
  # MagicBand component, actions, Command entity, light and buttons.
  magicband: github://Legal-Copy7045/Magic-bHAnds/esphome/magicband-addon.yaml@main

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  name_add_mac_suffix: true   # e.g. screek-bp2-poe-849a4c, as the factory firmware

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG   # logs over the USB-C port

api:
  encryption:
    key: !secret bp2_api_key

ota:
  - platform: esphome
    encryption:
      key: !secret bp2_api_key

safe_mode:

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9
  clock_speed: 25MHz

# Bluetooth proxy: always on, as on the factory firmware (continuous active
# scanning, 1100 ms interval and window, 4 connection slots). Band broadcasts
# share the radio with this scanning.
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true
    continuous: true

bluetooth_proxy:
  active: true
  connection_slots: 4

esp32_ble:
  max_connections: 4

time:
  - platform: homeassistant

debug:
  update_interval: 60s

light:
  - platform: esp32_rmt_led_strip
    id: identify_led
    name: "Identify LED"
    pin: GPIO21
    chipset: WS2812
    channel_colors: GRB
    num_leds: 1
    default_transition_length: 1s
    entity_category: config

sensor:
  - platform: internal_temperature
    name: "CPU Temperature"
    entity_category: diagnostic
  - platform: debug
    free:
      name: "Heap Free"
      entity_category: diagnostic

text_sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: ethernet_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic
  - platform: debug
    reset_reason:
      name: "Reboot Reason"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Reboot Device"
    entity_category: diagnostic
  - platform: safe_mode
    name: "Safe Mode Boot"
    entity_category: diagnostic
  - platform: factory_reset
    name: "Factory Reset"
    entity_category: diagnostic
