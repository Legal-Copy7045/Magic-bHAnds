# SCREEK BP2-POE (ESP32-S3 + W5500 Ethernet) as a Bluetooth proxy + MagicBand
# bridge. Rebuilt from the factory firmware's boot log (SCREEK.Bluetooth_Proxy
# BP2-POE 26.01.23-A), keeping its Scan Interval / Scan Window controls
# (Home Assistant sets active or passive scanning), plus the shared MagicBand add-on.
#
# Install: the web installer (https://legal-copy7045.github.io/Magic-bHAnds/)
# over USB-C, or the ESPHome Device Builder. No secrets needed. Later updates
# come from GitHub through Home Assistant's Firmware update entity.
# To go back to factory firmware, use SCREEK's web installer or a backup.

substitutions:
  name: screek-bp2-poe
  friendly_name: SCREEK BP2-POE
  project_version: "0.10.23"
  firmware_manifest: https://legal-copy7045.github.io/Magic-bHAnds/bp2/manifest.json

packages:
  # MagicBand component, actions, Command entity, light and buttons.
  magicband: github://Legal-Copy7045/Magic-bHAnds/esphome/magicband-addon.yaml@main

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  project:
    name: legal-copy7045.magicband-bp2-poe
    version: ${project_version}
  # Adds the MAC suffix (e.g. screek-bp2-poe-849a4c), as the factory firmware
  # does. In the ESPHome Device Builder, set `name: screek-bp2-poe-xxxxxx` and
  # `name_add_mac_suffix: false` instead, or the dashboard can't find the board
  # (see docs/screek-bp2-poe.md).
  name_add_mac_suffix: true

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# 8 MB PSRAM: room for Bluetooth and the HTTPS download of firmware updates.
psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG   # logs over the USB-C port

api:
  # Encrypted. Home Assistant gives the board its own key the first time it
  # connects, so there's no key to manage.
  encryption: {}

ota:
  # Updates come from the published firmware through Home Assistant (the
  # Firmware update entity), over the encrypted connection.
  - platform: http_request

http_request:

update:
  - platform: http_request
    name: Firmware
    source: ${firmware_manifest}
    update_interval: 6h

# Lets the ESPHome Device Builder offer "Take control" (adopt) for this device.
dashboard_import:
  package_import_url: github://Legal-Copy7045/Magic-bHAnds/esphome/screek-bp2-poe.yaml@main
  import_full_config: false

safe_mode:

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9
  clock_speed: 25MHz

# Bluetooth proxy: on by default, as on the factory firmware (active
# scanning, 1100 ms interval and window, 4 connection slots), with the same
# "Bluetooth proxy" switch as the MagicBand Bridge to turn it off. Band broadcasts
# share the radio with this scanning. The Scan Interval / Scan Window entities
# below adjust it at runtime. Active or passive scanning is set by Home
# Assistant: ESPHome integration -> this device -> Configure -> Bluetooth
# scanning mode. (A device-side switch fought that setting and made Home
# Assistant report the scanner as broken.)
esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true
    continuous: false   # started by the "Bluetooth proxy" switch (on by default)

bluetooth_proxy:
  active: true
  connection_slots: 4

esp32_ble:
  max_connections: 4

time:
  - platform: homeassistant

debug:
  update_interval: 60s

light:
  - platform: esp32_rmt_led_strip
    id: identify_led
    name: "Identify LED"
    pin: GPIO21
    chipset: WS2812
    channel_colors: GRB
    num_leds: 1
    default_transition_length: 1s
    entity_category: config

# --- Scan tuning (same entities as the factory firmware) ---------------------
# Changes restart scanning briefly to apply. Values survive reboots and are
# re-applied at boot. Bluetooth requires window <= interval, so the window is
# capped at the interval.
script:
  - id: apply_scan_settings
    mode: restart
    then:
      - lambda: |-
          float interval = id(scan_interval).state;
          float window = std::min(id(scan_window).state, interval);
          id(ble_tracker).set_scan_interval(static_cast<uint32_t>(interval / 0.625f));
          id(ble_tracker).set_scan_window(static_cast<uint32_t>(window / 0.625f));
          // Active or passive scanning is Home Assistant's choice: ESPHome
          // integration -> this device -> Configure -> Bluetooth scanning mode.
          ESP_LOGI("scan", "Apply BLE scan: interval=%.0fms window=%.0fms", interval, window);
      # Restart scanning to apply, unless the proxy is switched off.
      - if:
          condition:
            switch.is_on: proxy_switch
          then:
            - esp32_ble_tracker.stop_scan:
            - delay: 500ms
            - esp32_ble_tracker.start_scan:
                continuous: true

number:
  - platform: template
    id: scan_interval
    name: "Scan Interval"
    icon: mdi:bluetooth-settings
    unit_of_measurement: ms
    entity_category: config
    mode: box
    min_value: 20
    max_value: 10240
    step: 10
    initial_value: 1100
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: apply_scan_settings
  - platform: template
    id: scan_window
    name: "Scan Window"
    icon: mdi:bluetooth-settings
    unit_of_measurement: ms
    entity_category: config
    mode: box
    min_value: 20
    max_value: 10240
    step: 10
    initial_value: 1100
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: apply_scan_settings

switch:
  # Same as the MagicBand Bridge's: turns the Bluetooth proxy (scanning) on
  # or off. On by default here, as on the factory firmware.
  - platform: template
    id: proxy_switch
    name: "Bluetooth proxy"
    icon: mdi:bluetooth-connect
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - esp32_ble_tracker.start_scan:
          continuous: true
    turn_off_action:
      - esp32_ble_tracker.stop_scan:

sensor:
  - platform: internal_temperature
    name: "CPU Temperature"
    entity_category: diagnostic
  - platform: debug
    free:
      name: "Heap Free"
      entity_category: diagnostic

text_sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: ethernet_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic
  - platform: debug
    reset_reason:
      name: "Reboot Reason"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Reboot Device"
    entity_category: diagnostic
  - platform: safe_mode
    name: "Safe Mode Boot"
    entity_category: diagnostic
  # No "Factory Reset" button: any Home Assistant user could press it, and a
  # reset board accepts the first client that brings a new encryption key.
