blueprint:
  name: MagicBand+ notification
  description: >-
    Light up and/or buzz nearby MagicBand+ bands when something happens.
    Requires one or more MagicBand Bridges (ESP32-S3, firmware 0.3.0+) added to
    Home Assistant through the ESPHome integration. Sends through every bridge
    unless you pick specific ones.
  domain: automation
  source_url: https://github.com/Legal-Copy7045/Magic-bHAnds/blob/main/homeassistant/blueprints/automation/magicband_notify.yaml
  input:
    when:
      name: When
      description: What should trigger the band? (doorbell pressed, washer finished, ...)
      selector:
        trigger: {}
    bridges:
      name: Bridges
      description: >-
        Which bridges broadcast the effect. Leave empty to use all of them.
        Pick each bridge's "Command" entity.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - integration: esphome
              domain: text
    effect_section:
      name: Effect
      icon: mdi:watch-variant
      input:
        effect:
          name: Effect
          default: color
          selector:
            select:
              mode: dropdown
              options:
                - {label: "Single colour (palette)", value: color}
                - {label: "Any colour (colour picker)", value: rgb}
                - {label: "Centre + outer ring", value: dual_color}
                - {label: "Five colours", value: five_color}
                - {label: "Crossfade", value: crossfade}
                - {label: "Animation", value: animation}
                - {label: "Vibrate only", value: buzz}
        color1:
          name: Colour
          description: Single colour; centre colour for "centre + outer"; first crossfade colour.
          default: blue
          selector: &colour
            select:
              mode: dropdown
              options:
                - red
                - red_orange
                - orange
                - yellow
                - off_yellow
                - lime
                - lime_green
                - green
                - cyan
                - blue
                - midnight_blue
                - purple
                - bright_purple
                - lavender
                - pink
                - white
                - unique
                - random
        color2:
          name: Second colour
          description: Outer ring for "centre + outer"; second crossfade colour.
          default: pink
          selector: *colour
        colors:
          name: Five colours
          description: "Comma-separated: centre, top right, bottom right, bottom left, top left."
          default: "red, orange, yellow, green, blue"
          selector:
            text: {}
        rgb_color:
          name: Custom colour
          description: Used by "Any colour".
          default: [255, 0, 180]
          selector:
            color_rgb: {}
        animation:
          name: Animation
          default: color_cycle
          selector:
            select:
              mode: dropdown
              options:
                - {label: "Colour cycle", value: color_cycle}
                - {label: "Rainbow", value: rainbow}
                - {label: "Lightning", value: lightning}
                - {label: "Orange blink", value: orange_blink}
                - {label: "Circle", value: circle}
                - {label: "Crossfade", value: crossfade}
                - {label: "Spin + buzz", value: spin_buzz}
        vibration:
          name: Vibration
          default: "0"
          selector:
            select:
              mode: dropdown
              options:
                - {label: "None", value: "0"}
                - {label: "1 · short buzz", value: "1"}
                - {label: "2 · buzz", value: "2"}
                - {label: "3 · long buzz", value: "3"}
                - {label: "4 · buzz + pulse", value: "4"}
                - {label: "5 · rumble", value: "5"}
                - {label: "6 · long rumble", value: "6"}
                - {label: "7 · 2-second buzz", value: "7"}
                - {label: "8 · flutter", value: "8"}
                - {label: "9 · short buzz (alt)", value: "9"}
                - {label: "10 · half-second pulse", value: "10"}
                - {label: "11 · one-second pulse", value: "11"}
    timing_section:
      name: Timing & LEDs (single colour / any colour)
      icon: mdi:timer-outline
      collapsed: true
      input:
        always_on:
          name: Stay on
          description: Keep the light on until another command (or the bridge's MagicBand light is turned off).
          default: false
          selector:
            boolean: {}
        on_seconds:
          name: On time (seconds)
          description: 0 = default (~27s). The band supports roughly 6-52 seconds.
          default: 0
          selector:
            number: {min: 0, max: 52, step: 1, mode: slider}
        fade_seconds:
          name: Fade out (seconds)
          default: 2
          selector:
            number: {min: 0, max: 3, step: 1, mode: slider}
        leds:
          name: LEDs (single colour)
          default: all
          selector:
            select:
              options:
                - {label: "All", value: all}
                - {label: "Top left", value: top_left}
                - {label: "Top right", value: top_right}
                - {label: "Bottom left", value: bottom_left}
                - {label: "Bottom right", value: bottom_right}
    advanced:
      name: Advanced
      icon: mdi:cog
      collapsed: true
      input:
        repeat:
          name: Repeat
          description: How many times to send the effect.
          default: 1
          selector:
            number: {min: 1, max: 5, step: 1, mode: box}

mode: queued
max: 5

triggers: !input when

variables:
  bridges: !input bridges
  effect: !input effect
  color1: !input color1
  color2: !input color2
  colors: !input colors
  rgb_color: !input rgb_color
  animation: !input animation
  vibration: !input vibration
  always_on: !input always_on
  on_seconds: !input on_seconds
  fade_seconds: !input fade_seconds
  leds: !input leds
  repeat_count: !input repeat
  # Every bridge's Command entity, unless specific ones were picked.
  targets: >-
    {%- if bridges -%}
      {{- bridges -}}
    {%- else -%}
      {%- set ns = namespace(e=[]) -%}
      {%- for e in integration_entities('esphome') | select('match', 'text[.]') | select('search', '_command$') -%}
        {%- set d = device_id(e) -%}
        {%- set has_light = d and (device_entities(d) | select('match', 'light[.].*magicband') | list | count > 0) -%}
        {%- set label = ((device_attr(d, 'model') or '') ~ ' ' ~ (device_attr(d, 'name') or '') ~ ' ' ~ e) | lower -%}
        {%- if has_light or 'magicband' in label -%}{%- set ns.e = ns.e + [e] -%}{%- endif -%}
      {%- endfor -%}
      {{- ns.e -}}
    {%- endif -%}
  # The command as JSON. The "mb" prefix stops Home Assistant turning it into a
  # dict; the bridge ignores everything before the first "{".
  command: >-
    {% set v = vibration | int %}
    {% set timing = {'on_seconds': on_seconds | float, 'fade_seconds': fade_seconds | int, 'always_on': always_on} %}
    {% if effect == 'color' %}
      {% set c = dict(timing, effect='color', color=color1, leds=leds, vibration=v) %}
    {% elif effect == 'rgb' %}
      {% set c = dict(timing, effect='rgb', rgb=rgb_color, vibration=v) %}
    {% elif effect == 'dual_color' %}
      {% set c = {'effect': 'dual_color', 'inner': color1, 'outer': color2, 'vibration': v} %}
    {% elif effect == 'five_color' %}
      {% set c = {'effect': 'five_color', 'colors': colors, 'vibration': v} %}
    {% elif effect == 'crossfade' %}
      {% set c = {'effect': 'crossfade', 'color1': color1, 'color2': color2, 'vibration': v} %}
    {% elif effect == 'animation' %}
      {% set c = {'effect': 'animation', 'name': animation} %}
    {% else %}
      {% set c = {'effect': 'buzz', 'vibration': v} %}
    {% endif %}
    mb{{ c | to_json }}

actions:
  - if: "{{ targets | count == 0 }}"
    then:
      - action: system_log.write
        data:
          level: warning
          logger: blueprints.magicband_notify
          message: "No MagicBand bridges found. Is a bridge added through ESPHome?"
      - stop: No bridges
  - repeat:
      count: "{{ repeat_count | int }}"
      sequence:
        - action: text.set_value
          target:
            entity_id: "{{ targets }}"
          data:
            value: "{{ command | trim }}"
        - delay: {seconds: 2}
