# Example automations. Replace the entity IDs with your own.
# These use script.magicband_send from magicband_scripts.yaml.

- alias: "MagicBand: flash on doorbell"
  triggers:
    - trigger: state
      entity_id: binary_sensor.front_doorbell   # <- your doorbell
      to: "on"
  actions:
    - action: script.magicband_doorbell

- alias: "MagicBand: washing machine finished"
  triggers:
    - trigger: state
      entity_id: sensor.washing_machine_status  # <- your appliance
      to: "finished"
  actions:
    - action: script.magicband_send
      data:
        command: {effect: dual_color, inner: cyan, outer: white, vibration: 2}
