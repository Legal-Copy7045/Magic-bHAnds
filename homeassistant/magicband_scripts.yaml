# Home Assistant scripts for MagicBand bridges (firmware 0.3.0+).
#
# Paste into scripts.yaml (or a package). Everything goes through
# script.magicband_send, which sends a command to every bridge's "Command"
# entity, or only to the bridges you list.
#
# Command fields are listed in docs/commands.md.

magicband_send:
  alias: "MagicBand: send command"
  icon: mdi:access-point
  mode: queued
  fields:
    command:
      name: Command
      description: 'e.g. {"effect": "color", "color": "red", "vibration": 3}'
      required: true
      selector: {object: {}}
    bridges:
      name: Bridges
      description: Command entities of the bridges to use. Empty = all bridges.
      default: []
      selector:
        entity:
          multiple: true
          filter: [{integration: esphome, domain: text}]
  variables:
    targets: >-
      {%- if bridges -%}
        {{- bridges -}}
      {%- else -%}
        {%- set ns = namespace(e=[]) -%}
        {%- for e in integration_entities('esphome') | select('match', 'text[.]') | select('search', '_command$') -%}
          {%- set d = device_id(e) -%}
          {%- set has_light = d and (device_entities(d) | select('match', 'light[.].*magicband') | list | count > 0) -%}
          {%- set label = ((device_attr(d, 'model') or '') ~ ' ' ~ (device_attr(d, 'name') or '') ~ ' ' ~ e) | lower -%}
          {%- if has_light or 'magicband' in label -%}{%- set ns.e = ns.e + [e] -%}{%- endif -%}
        {%- endfor -%}
        {{- ns.e -}}
      {%- endif -%}
  sequence:
    - condition: template
      value_template: "{{ targets | count > 0 }}"
    - action: text.set_value
      target:
        entity_id: "{{ targets }}"
      data:
        # "mb" prefix stops HA converting the JSON back into a dict.
        value: "mb{{ command | to_json }}"

# Named presets: call these from automations and dashboards.
magicband_doorbell:
  alias: "MagicBand: doorbell"
  icon: mdi:doorbell
  sequence:
    - action: script.magicband_send
      data:
        command: {effect: color, color: yellow, vibration: 5}

magicband_dinner_ready:
  alias: "MagicBand: dinner's ready"
  icon: mdi:silverware-fork-knife
  sequence:
    - action: script.magicband_send
      data:
        command: {effect: five_color, colors: "red, orange, yellow, green, blue", vibration: 3}

magicband_rgb:
  alias: "MagicBand: any colour"
  icon: mdi:palette
  fields:
    rgb_color:
      name: Colour
      required: true
      default: [255, 0, 180]
      selector: {color_rgb: {}}
    always_on:
      name: Stay on until turned off
      default: false
      selector: {boolean: {}}
  sequence:
    - action: script.magicband_send
      data:
        command:
          effect: rgb
          rgb: "{{ rgb_color }}"
          always_on: "{{ always_on }}"

magicband_off:
  alias: "MagicBand: lights off"
  icon: mdi:lightbulb-off
  sequence:
    - action: script.magicband_send
      data:
        command: {effect: "off"}

# Example: only the kitchen bridge (use your bridge's Command entity ID).
magicband_kitchen_buzz:
  alias: "MagicBand: buzz (kitchen bridge only)"
  icon: mdi:vibrate
  sequence:
    - action: script.magicband_send
      data:
        command: {effect: buzz, vibration: 7}
        bridges:
          - text.magicband_bridge_3fa2c1_command

magicband_raw:
  alias: "MagicBand: raw hex (experiments)"
  icon: mdi:code-braces
  fields:
    hex:
      name: Hex payload
      example: "E9 05 00 2E 0E E5 B3"
      required: true
      selector: {text: {}}
  sequence:
    - action: script.magicband_send
      data:
        command:
          effect: raw
          hex: "{{ hex }}"
