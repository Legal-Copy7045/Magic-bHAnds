# Example Home Assistant scripts for MagicBand bridges.
#
# Optional: with the MagicBand integration (HACS) installed you can call
# magicband.send directly. These examples wrap it for convenience; paste them
# into scripts.yaml if you want them.
#
# Command fields are listed in docs/commands.md.

magicband_send:
  alias: "MagicBand: send command"
  icon: mdi:access-point
  mode: queued
  fields:
    command:
      name: Command
      description: 'e.g. {"effect": "color", "color": "red", "vibration": 3}'
      required: true
      selector: {object: {}}
    bridges:
      name: Bridges
      description: Command entities of the bridges to use. Empty = all bridges.
      default: []
      selector:
        entity:
          multiple: true
          filter: [{integration: esphome, domain: text}]
  sequence:
    # Needs the MagicBand integration (HACS). You can also call
    # magicband.send directly instead of using this script.
    - action: magicband.send
      data:
        command: "{{ command }}"
        bridges: "{{ bridges }}"

# Named presets: call these from automations and dashboards.
magicband_doorbell:
  alias: "MagicBand: doorbell"
  icon: mdi:doorbell
  sequence:
    - action: script.magicband_send
      data:
        command: {effect: color, color: yellow, vibration: 5}

magicband_dinner_ready:
  alias: "MagicBand: dinner's ready"
  icon: mdi:silverware-fork-knife
  sequence:
    - action: script.magicband_send
      data:
        command: {effect: five_color, colors: "red, orange, yellow, green, blue", vibration: 3}

magicband_rgb:
  alias: "MagicBand: any colour"
  icon: mdi:palette
  fields:
    rgb_color:
      name: Colour
      required: true
      default: [255, 0, 180]
      selector: {color_rgb: {}}
    always_on:
      name: Stay on until turned off
      default: false
      selector: {boolean: {}}
  sequence:
    - action: script.magicband_send
      data:
        command:
          effect: rgb
          rgb: "{{ rgb_color }}"
          always_on: "{{ always_on }}"

magicband_off:
  alias: "MagicBand: lights off"
  icon: mdi:lightbulb-off
  sequence:
    - action: script.magicband_send
      data:
        command: {effect: "off"}   # quoted: a bare off means false in YAML

# Example: only the kitchen bridge (use your bridge's Command entity ID).
magicband_kitchen_buzz:
  alias: "MagicBand: buzz (kitchen bridge only)"
  icon: mdi:vibrate
  sequence:
    - action: script.magicband_send
      data:
        command: {effect: buzz, vibration: 7}
        bridges:
          - text.magicband_bridge_3fa2c1_command

magicband_raw:
  alias: "MagicBand: raw hex (experiments)"
  icon: mdi:code-braces
  fields:
    hex:
      name: Hex payload
      example: "E9 05 00 2E 0E E5 B3"
      required: true
      selector: {text: {}}
  sequence:
    - action: script.magicband_send
      data:
        command:
          effect: raw
          hex: "{{ hex }}"
