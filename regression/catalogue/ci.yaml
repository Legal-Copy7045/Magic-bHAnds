# The release tooling in .github/ (regression/ci/run.py): signing, versions, the privacy guard, the site and the
# workflows. Everything runs on copies in a temp folder with a throwaway key; the real PRIVACY_DENYLIST is never read.
- feature: 'Signed firmware updates: CI signing (sign_firmware.py)'
  since: 0.10.30
  docs: docs/security.md#devices-and-updates
  match:
  - '^[a-z]+:(CI\-001|CI\-002|CI\-003|CI\-004|CI\-005|CI\-006|CI\-007|CI\-008|CI\-009|CI\-010|CI\-011) '
- feature: 'Signed firmware updates: official builds switch them on (signed_build.py)'
  since: 0.10.30
  docs: docs/security.md#devices-and-updates
  match:
  - '^[a-z]+:(CI\-012|CI\-013|CI\-014|CI\-015) '
- feature: 'Setup hotspot: official signed builds of the Wi-Fi devices only (signed_build.py adds an open ap and captive_portal; the device files have none)'
  since: 0.10.33
  docs: docs/security.md#devices-and-updates
  match:
  - '^[a-z]+:(CI\-012|CI\-056) '
- feature: 'Release: every part carries the same version (check_versions.py, release_notes.py)'
  since: 0.7.0
  docs: CHANGELOG.md
  match:
  - '^[a-z]+:(CI\-016|CI\-017|CI\-018|CI\-019) '
- feature: 'Privacy guard (privacy_guard.py): no-reply commits, no credentials or secrets files, private terms'
  since: 0.10.30
  docs: CLAUDE.md
  match:
  - '^[a-z]+:(CI\-020|CI\-021|CI\-022|CI\-023|CI\-024|CI\-025|CI\-026|CI\-027) '
- feature: 'Privacy guard: every commit in the pushed range (added lines and files), new branches from the merge base, file names, binary text runs and zip members'
  since: 0.10.32
  docs: docs/security.md#the-privacy-guard-this-repository
  match:
  - '^[a-z]+:(CI\-041|CI\-042|CI\-043|CI\-044|CI\-045|CI\-066) '
- feature: 'Privacy guard: NUL-separated parsing (control bytes, odd file names), force pushes from the merge base, paths matching a term never printed'
  since: 0.10.32
  docs: docs/security.md#the-privacy-guard-this-repository
  match:
  - '^[a-z]+:(CI\-049|CI\-050|CI\-051|CI\-052) '
- feature: Web installer site and update manifests (make_site.py, vendored ESP Web Tools)
  since: 0.10.4
  docs: docs/security.md#devices-and-updates
  match:
  - '^[a-z]+:(CI\-028|CI\-029|CI\-030) '
- feature: SCREEK BP2-POE standalone file matches the shared add-on (check_bp2_standalone.py)
  since: 0.7.1
  docs: docs/screek-bp2-poe.md
  match:
  - '^[a-z]+:(CI\-031) '
- feature: Release pipeline security (.github/workflows/ci.yml)
  since: 0.10.4
  docs: docs/security.md#devices-and-updates
  match:
  - '^[a-z]+:(CI\-032|CI\-033|CI\-034|CI\-035|CI\-036|CI\-037|CI\-038|CI\-039|CI\-040) '
- feature: 'Signing job hardening: tag commits must be on main before the key; tools installed only by hash; attestations verified against the workflow and main'
  since: 0.10.32
  docs: docs/security.md#devices-and-updates
  match:
  - '^[a-z]+:(CI\-037|CI\-046|CI\-047|CI\-048) '
- feature: 'Releases only from main (a merged version bump, or Run workflow): sign runs only for main; a pushed tag can''t reach the key (release-signing allows main only)'
  since: 0.10.32
  docs: docs/security.md#devices-and-updates
  match:
  - '^[a-z]+:(CI\-033|CI\-053) '
- feature: 'docs/security.md: no claim a review found false; accepted risks listed'
  since: 0.10.32
  docs: docs/security.md#accepted-risks
  match:
  - '^[a-z]+:(CI\-054) '
- feature: 'Release protection: the account that can push to main uses two-factor authentication (no required-reviewer advice); release-signing limited to main'
  since: 0.10.33
  docs: docs/security.md#accepted-risks
  match:
  - '^[a-z]+:(CI\-055) '
- feature: 'Round-3 docs: restarting a device never leads to safe mode; firmware guard comment matches the manifest-version check; a new board''s setup hotspot can be claimed until it''s added to Home Assistant'
  since: 0.10.34
  docs: docs/security.md#accepted-risks
  match:
  - '^[a-z]+:(CI\-057) '
- feature: 'Faster cycle: a merge to main with a new VERSION releases from the same signed build; the three firmwares build in parallel from main''s cached build files; pull requests that change nothing
    the firmware is built from skip the build; other branches build only through their pull request'
  since: 0.10.38
  docs: README.md
  match:
  - '^[a-z]+:(CI\-058|CI\-059|CI\-060) '
- feature: 'Reader carrier PCB, JLCPCB placement file: KiCad''s positions with JLCPCB''s angle corrections (U1-U3) and J1 (USB-C) moved 1.3 mm into the board for JLCPCB''s model'
  since: 0.10.38
  docs: hardware/reader-carrier/README.md
  match:
  - '^[a-z]+:(CI\-061) '
- feature: Runs on main are never cancelled (an automatic release can't be cut off by the next merge)
  since: 0.10.38
  docs: .github/workflows/ci.yml
  match:
  - '^[a-z]+:(CI\-062) '
- feature: 'Economical CI (project standard 1.1.0): pull requests only (drafts skipped), main only to release an untagged VERSION (and the private-terms check), a weekly run, Run workflow;
    integration tests and firmware builds only for PRs that touch them (.github/changes.yaml); ci-result the one gate; CodeQL weekly; Dependabot weekly, minor/patch grouped, the signing tools never merged automatically'
  since: 0.10.38
  docs: README.md
  match:
  - '^[a-z]+:(CI\-063|CI\-064|CI\-065) '
