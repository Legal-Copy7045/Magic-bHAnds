# Stable check IDs for the ci stage (regression/ids.py). Append-only: never renumber or reuse an
# ID. A removed check stays here with its text starting "RETIRED"; a new check takes a new number.
CI-001: "A throwaway RSA-3072 key pair is made with espsecure in a temp folder (not the repo)"
CI-002: "Signs a 64 KB-aligned app pair: exit 0, firmware.ota.bin = app + one 4 KB signature sector"
CI-003: "The signed image verifies with the matching public key (espsecure verify-signature)"
CI-004: "The signed image does NOT verify with a different key"
CI-005: "Factory image rebuilt: bootloader/partitions/otadata unchanged, signed app at 0x10000"
CI-006: "Refuses to sign again an image that's already signed (files left as they were)"
CI-007: "Refuses an app that isn't padded to 64 KB (built without signed updates)"
CI-008: "Refuses when the private key doesn't match the committed public key (wrong secret)"
CI-009: "Refuses a factory image that doesn't end with the app at 0x10000"
CI-010: "Refuses to run without the public key file"
CI-011: "The committed esphome/firmware-signing-key.pub.pem is an RSA-3072 public key, not a private one"
CI-012: "Adds exactly the four sdkconfig options under esp32 framework esp-idf and, for the Wi-Fi devices only (bridge, reader), the setup hotspot (an open wifi ap '${friendly_name} Setup' with ap_timeout 2min, and captive_portal); nothing else changes, and the BP2 (Ethernet) gets no hotspot"
CI-013: "Refuses a file that already has sdkconfig_options"
CI-014: "Works in place (the workflow passes the same file as input and output for reader and BP2)"
CI-015: "Refuses a file without one 'framework: type: esp-idf' block; device files in the repo stay unlocked"
CI-016: "Passes on the current tree, and with the matching tag v<VERSION>"
CI-017: "Fails when one part has another version (temp copy: manifest.json and a device file)"
CI-018: "Fails on a wrong tag and on a CHANGELOG without the version's section"
CI-019: "release_notes.py prints the CHANGELOG section for VERSION and refuses an unknown version"
CI-020: "Passes on the current tree (HEAD commit and tracked files) with an empty PRIVACY_DENYLIST"
CI-021: "A clean repository with a no-reply author passes"
CI-022: "Flags a tracked *.pem (a key file) by name"
CI-023: "Does not flag a tracked *.pub.pem holding a public key"
CI-024: "Flags BEGIN PRIVATE KEY content even in a *.pub.pem"
CI-025: "Flags a commit whose author isn't a no-reply address"
CI-026: "Flags a credential-looking token in a file and a tracked secrets.yaml"
CI-027: "A private term from PRIVACY_DENYLIST is reported by file, line and rule number, never echoed"
CI-028: "Assembles the site from fake builds: manifests for bridge (root), reader/ and bp2/ with VERSION, firmware copied, OTA md5 matching the file"
CI-029: "Vendors ESP Web Tools from npm, checked against its fixed integrity hash"
CI-030: "Refuses builds whose device files have different versions, and a missing build output"
CI-031: "check_bp2_standalone.py passes (esphome config of both BP2 files resolves to the same device)"
CI-032: "Every action in firmware.yml and privacy.yml is pinned to a commit SHA (firmware.yml: with its tag as a comment)"
CI-033: "The sign job only runs for main (never a tag or a pull_request), after build"
CI-034: "The sign job uses the release-signing environment (which holds OTA_SIGNING_KEY)"
CI-035: "deploy and release need sign (and the tests); deploy only on main; release only on main (a push with a new VERSION, or a release run), and checks the commit is on main"
CI-036: "Secrets: OTA_SIGNING_KEY only in the sign job; the build job (runs for every branch and PR) has no secrets; no pull_request_target"
CI-037: "Permissions are minimal: read-only by default; write only where a job needs it"
CI-038: "The signing key is written with umask 077 in a subshell and removed on exit (trap)"
CI-039: "Every checkout drops its credentials (persist-credentials: false)"
CI-040: "Pages and release files come from the signed images: the site is assembled in sign from the signed builds; release downloads the 'firmware' artifact sign uploads"
CI-041: "A private term added in one commit and removed in the next of the same push (BASE..HEAD) is caught, by commit and rule number, without echoing it"
CI-042: "A new branch or tag (BASE all zeros) is checked from its merge base with origin/main: an earlier commit's removed term and author address are caught, main's own history is not re-checked"
CI-043: "A private term in a file name or path is caught (tracked tree and the commit adding it) and the path isn't printed"
CI-044: "Binary files: a private term in a PNG text chunk, in a UTF-16 string, and in a .zip member's name or content is caught (tree and history) without echoing it; credentials rules don't apply to binary runs"
CI-045: "privacy.yml gives the guard the pushed range: full history checkout, BASE = the push's before (or the PR base), HEAD = the pushed commit (or the PR head)"
CI-046: "The sign job checks the commit is on main (as release does) before it installs anything or touches the key, with the full history checked out"
CI-047: "The sign job (holds OTA_SIGNING_KEY) installs only hash-pinned packages: pip --require-hashes --no-deps from .github/requirements-signing*.txt, every package pinned with == and a sha256 hash, esptool at the version the CI tooling expects"
CI-048: "The attestation check in docs/security.md and the release job pins the signer workflow and the main branch, not only the repository"
CI-049: "A control byte (\\x01) and non-UTF-8 bytes in an added line don't hide the rest of the commit: a term later in the same file, in another file and in a binary of that commit are all caught, and the guard doesn't crash"
CI-050: "Binaries whose names contain a double quote, a backslash or ' and ' are scanned (added, and modified), even when removed again in the same push"
CI-051: "A force push is checked from the merge base of the old and new tips (BASE not an ancestor of HEAD), or the whole history when the old tip isn't in the clone; not only the tip"
CI-052: "A path that matches a private term is never printed, even when git would quote it (quotes, backslash) and its content also matches or looks like a credential: only its position is"
CI-053: "Releases only from main (a merged version bump, or Run workflow): sign (the release job's dependency) runs only for refs/heads/main, and the workflow header, README and docs/security.md say a pushed tag can't reach the key (the release-signing environment allows main only) and isn't released"
CI-054: "docs/security.md makes no claim the round-2 review found false, and lists the accepted risks it added (pairing race on a new reader, rollback via the unsigned manifest version, lockout settings any user can change, restarting a device, unpinned build toolchain, the unknown-band flood guard, a stranger taking a Wi-Fi device offline through its setup hotspot)"
CI-055: "The account that can push to main is what protects releases: README, docs/security.md (Signed updates and the accepted risk) and the sign job's comment in firmware.yml say it should use two-factor authentication and keep the release-signing environment limited to main, and none of them recommends a required reviewer"
CI-056: "The device files in the repo have no hotspot (own builds aren't signed, so anyone who joined one could upload any firmware); signed_build.py refuses a Wi-Fi file that already has an ap or captive_portal, and the output for a Wi-Fi file parses with wifi.ap and captive_portal"
CI-057: "Round-3 review (SEC-020, SEC-022): restarting a device is a few seconds offline per press and never leads to safe mode (no claim that quick reboots count as failed boots); the firmware's guard comment says the manifest version, not a signed one, decides 'newer'; a brand-new board's setup hotspot lets whoever connects first claim it until it's added to Home Assistant (security.md First connection, reader.md and bridge.md setup steps)"
CI-058: "A merge to main releases a new VERSION from the same signed build: the versions job says new_version only for a push to main whose v<VERSION> tag doesn't exist, and release needs versions"
CI-059: "The firmware builds in parallel (bridge, reader, BP2), keeps no secrets, restores compiled files from main's cache and saves them only from a push to main; sign and the site check take all three"
CI-060: "A pull request skips the firmware build only when it changes nothing the firmware is built from (esphome/, components/, VERSION, firmware.yml, the signing requirements and build scripts); pushes always build"
CI-061: "fab/cpl.csv (JLCPCB) is fab/cpl-kicad.csv with only make_fab.py's JLC_ROTATION and JLC_OFFSET applied (J1 moved 1.3 mm into the board for JLCPCB's USB-C model); same parts, same layer"
CI-062: "Runs on main are never cancelled (a merge landing mid-release waits for it); only a newer push to a pull request replaces its older build"
CI-063: "Economical triggers: pull requests (opened, synchronize, reopened, ready_for_review) with drafts skipped, main only for a VERSION change, a weekly run, Run workflow; integration tests only for PRs that touch the integration, its tests or the harness"
CI-064: "CodeQL runs weekly and on demand (codeql.yml), for actions, python, javascript-typescript and c-cpp, with pinned actions and security-events write only in its job"
CI-065: "Dependabot: monthly, one grouped pull request per ecosystem (GitHub Actions, the pinned signing tools)"
